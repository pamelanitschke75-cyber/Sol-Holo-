<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sol Holo – Test 006</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #05070d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin: 8px 0 4px;
      font-size: 32px;
    }

    .subtitle {
      margin: 0 0 18px;
      text-align: center;
      color: #9da7b3;
      line-height: 1.4;
    }

    .box {
      margin-bottom: 16px;
      padding: 16px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 14px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
    }

    #avatar {
      position: relative;
      width: 100%;
      height: 520px;
      overflow: hidden;
      background: #080b24;
      border: 1px solid #30363d;
      border-radius: 16px;
    }

    input,
    button {
      width: 100%;
      min-height: 50px;
      margin-top: 12px;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
    }

    input {
      color: #ffffff;
      background: #161b22;
      border: 1px solid #30363d;
    }

    button {
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .small {
      margin-top: 12px;
      color: #9da7b3;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
    }
  </style>


  <!--
    TalkingHead 1.7
    Three.js 0.180
  -->

  <script type="importmap">
  {
    "imports": {
      "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js/+esm",

      "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",

      "talkinghead":
        "https://cdn.jsdelivr.net/gh/met4citizen/TalkingHead@1.7/modules/talkinghead.mjs"
    }
  }
  </script>

</head>


<body>

<div class="container">

  <h1>Sol Holo</h1>

  <p class="subtitle">
    TEST 006 – Open Source Audio-Lip-Sync
  </p>


  <div class="box">

    <div id="status">
      TalkingHead wird geladen …
    </div>

  </div>


  <div
    id="avatar"
  ></div>


  <div class="box">

    <strong>
      Audiodatei auswählen
    </strong>

    <input
      id="audioFile"
      type="file"
      accept="audio/*"
      disabled
    >

    <button
      id="playButton"
      disabled
    >
      Audio mit Sol Holo abspielen
    </button>

  </div>


  <p class="small">
    Sol Holo – Forschungs- und Entwicklungsprototyp.<br>
    Open-Source-Lip-Sync:
    TalkingHead by met4citizen.<br>
    Avatar-Datei:
    sol.glb
  </p>

</div>


<script type="module">

import {
  TalkingHead
} from "talkinghead";


/* =====================================================
   ELEMENTE
===================================================== */

const avatarElement =
  document.getElementById("avatar");

const statusElement =
  document.getElementById("status");

const audioInput =
  document.getElementById("audioFile");

const playButton =
  document.getElementById("playButton");


/* =====================================================
   STATUS
===================================================== */

function setStatus(text) {

  statusElement.textContent =
    text;

}


/* =====================================================
   TALKINGHEAD
===================================================== */

let head = null;

let avatarLoaded = false;


/* =====================================================
   AVATAR LADEN
===================================================== */

async function initAvatar() {

  try {

    setStatus(
      "TalkingHead startet …"
    );


    /*
      TalkingHead erzeugen.

      Kein Google-TTS-Key nötig,
      weil wir in diesem Test
      keine Text-to-Speech-Funktion benutzen.
    */

    head =
      new TalkingHead(
        avatarElement,
        {

          lipsyncModules: [
            "de",
            "en"
          ],

          cameraView:
            "upper",

          avatarMood:
            "neutral",

          modelFPS:
            30,

          mixerGainSpeech:
            1

        }
      );


    setStatus(
      "Sol Avatar wird geladen …"
    );


    /*
      WICHTIG:

      Die Datei sol.glb muss
      im selben GitHub-Ordner
      wie index.html liegen.
    */

    await head.showAvatar(
      {

        url:
          "./sol.glb",

        body:
          "F",

        avatarMood:
          "neutral"

      },
      (event) => {

        /*
          Optional:
          Download-Fortschritt
          in Prozent anzeigen.
        */

        if (
          event &&
          event.lengthComputable
        ) {

          const percent =
            Math.round(
              event.loaded /
              event.total *
              100
            );

          setStatus(
            "Sol wird geladen: " +
            percent +
            "%"
          );

        }

      }
    );


    avatarLoaded = true;

    audioInput.disabled =
      false;


    setStatus(
      "Sol Holo ist bereit. ✅"
    );

  }

  catch (error) {

    console.error(
      error
    );


    setStatus(
      "Avatar-Fehler: " +
      error.message
    );

  }

}


/* =====================================================
   AUDIODATEI AUSGEWÄHLT
===================================================== */

audioInput.addEventListener(
  "change",
  function() {

    if (
      !avatarLoaded
    ) {

      playButton.disabled =
        true;

      return;

    }


    if (
      audioInput.files.length === 0
    ) {

      playButton.disabled =
        true;

      return;

    }


    const file =
      audioInput.files[0];


    setStatus(
      "Audio ausgewählt: " +
      file.name
    );


    playButton.disabled =
      false;

  }
);


/* =====================================================
   AUDIODATEI DEKODIEREN
===================================================== */

async function decodeAudioFile(file) {

  const arrayBuffer =
    await file.arrayBuffer();


  const AudioContextClass =
    window.AudioContext ||
    window.webkitAudioContext;


  if (
    !AudioContextClass
  ) {

    throw new Error(
      "Web Audio API wird nicht unterstützt."
    );

  }


  const audioContext =
    new AudioContextClass();


  try {

    const audioBuffer =
      await audioContext
        .decodeAudioData(
          arrayBuffer.slice(0)
        );


    return {
      audioBuffer,
      audioContext
    };

  }

  catch (error) {

    await audioContext.close();

    throw error;

  }

}


/* =====================================================
   AUDIO ABSPIELEN
===================================================== */

playButton.addEventListener(
  "click",
  async function() {

    if (
      !avatarLoaded ||
      !head
    ) {

      setStatus(
        "Sol Holo ist noch nicht bereit."
      );

      return;

    }


    const file =
      audioInput.files[0];


    if (!file) {

      setStatus(
        "Bitte zuerst eine Audiodatei auswählen."
      );

      return;

    }


    playButton.disabled =
      true;


    try {

      setStatus(
        "Audio wird vorbereitet …"
      );


      const {
        audioBuffer,
        audioContext
      } =
        await decodeAudioFile(
          file
        );


      /*
        WAV/MP3/M4A usw. werden vom
        Browser zunächst decodiert.

        Für TalkingHead erzeugen wir
        anschließend ein WAV-Blob.
      */

      const wavBlob =
        audioBufferToWavBlob(
          audioBuffer
        );


      const wavArrayBuffer =
        await wavBlob.arrayBuffer();


      /*
        speakAudio kann Audio abspielen.

        isRaw bedeutet:
        kein künstliches Pausen-/Break-System
        innerhalb der Audiodaten.
      */

      setStatus(
        "Sol Holo spricht …"
      );


      await head.speakAudio(
        {

          audio:
            wavArrayBuffer,

          isRaw:
            true,

          lipsyncLang:
            "de"

        }
      );


      setStatus(
        "Audio fertig. ✅"
      );


      await audioContext.close();

    }

    catch (error) {

      console.error(
        error
      );


      setStatus(
        "Audio-Fehler: " +
        error.message
      );

    }

    finally {

      playButton.disabled =
        false;

    }

  }
);


/* =====================================================
   AUDIOBUFFER → WAV
===================================================== */

function audioBufferToWavBlob(
  audioBuffer
) {

  const numberOfChannels =
    audioBuffer.numberOfChannels;

  const sampleRate =
    audioBuffer.sampleRate;

  const length =
    audioBuffer.length *
    numberOfChannels *
    2 +
    44;


  const buffer =
    new ArrayBuffer(
      length
    );


  const view =
    new DataView(
      buffer
    );


  let offset =
    0;


  function writeString(
    value
  ) {

    for (
      let i = 0;
      i < value.length;
      i++
    ) {

      view.setUint8(
        offset++,
        value.charCodeAt(i)
      );

    }

  }


  function writeUint16(
    value
  ) {

    view.setUint16(
      offset,
      value,
      true
    );

    offset +=
      2;

  }


  function writeUint32(
    value
  ) {

    view.setUint32(
      offset,
      value,
      true
    );

    offset +=
      4;

  }


  /* WAV HEADER */

  writeString(
    "RIFF"
  );


  writeUint32(
    length - 8
  );


  writeString(
    "WAVE"
  );


  writeString(
    "fmt "
  );


  writeUint32(
    16
  );


  writeUint16(
    1
  );


  writeUint16(
    numberOfChannels
  );


  writeUint32(
    sampleRate
  );


  writeUint32(
    sampleRate *
    numberOfChannels *
    2
  );


  writeUint16(
    numberOfChannels *
    2
  );


  writeUint16(
    16
  );


  writeString(
    "data"
  );


  writeUint32(
    audioBuffer.length *
    numberOfChannels *
    2
  );


  /* PCM */

  for (
    let sample = 0;
    sample <
    audioBuffer.length;
    sample++
  ) {

    for (
      let channel = 0;
      channel <
      numberOfChannels;
      channel++
    ) {

      let value =
        audioBuffer
          .getChannelData(
            channel
          )[sample];


      value =
        Math.max(
          -1,
          Math.min(
            1,
            value
          )
        );


      view.setInt16(
        offset,
        value < 0
          ? value * 32768
          : value * 32767,
        true
      );


      offset +=
        2;

    }

  }


  return new Blob(
    [buffer],
    {
      type:
        "audio/wav"
    }
  );

}


/* =====================================================
   START
===================================================== */

initAvatar();

</script>

</body>
</html>
