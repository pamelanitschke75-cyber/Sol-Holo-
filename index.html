<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sol Holo – HOLO UI 001</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070d">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #03050a;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  position: relative;
  min-height: 100vh;
  max-width: 760px;
  margin: auto;
  background:
    radial-gradient(circle at 50% 35%, #112238 0%, #070b12 38%, #020307 75%);
  overflow: hidden;
}

/*
  Hintergrund
*/

#backgroundGlow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 44%, rgba(255,180,70,.10), transparent 28%),
    radial-gradient(circle at 85% 42%, rgba(20,100,255,.12), transparent 30%);
}

/*
  Kopf
*/

header {
  position: relative;
  z-index: 20;
  padding: 24px 24px 10px;
  text-align: center;
}

#menuButton {
  position: absolute;
  left: 18px;
  top: 22px;
  width: 52px;
  height: 52px;
  border: none;
  background: transparent;
  color: white;
  font-size: 32px;
}

#onlineState {
  position: absolute;
  right: 20px;
  top: 34px;
  font-size: 15px;
  color: #d6dbe5;
}

#onlineDot {
  color: #41e66e;
}

h1 {
  margin: 0;
  font-size: 40px;
  font-weight: 600;
  text-shadow: 0 0 22px rgba(255,196,90,.25);
}

#subtitle {
  margin-top: 7px;
  color: #f3c969;
  font-size: 17px;
}

/*
  Begrüßung
*/

#greeting {
  position: relative;
  z-index: 10;
  padding: 22px 28px 0;
}

#greetingTitle {
  font-size: 29px;
  margin: 0 0 8px;
}

#greetingText {
  color: #d7dbe2;
  line-height: 1.5;
  font-size: 18px;
  margin: 0;
}

/*
  Sol
*/

#solStage {
  position: relative;
  z-index: 4;
  height: min(67vh, 720px);
  min-height: 500px;
  margin-top: -45px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}

#solImage {
  display: block;
  max-height: 95%;
  max-width: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter:
    drop-shadow(0 0 8px rgba(70,145,255,.42))
    drop-shadow(0 0 24px rgba(25,105,255,.22));
}

#holoBase {
  position: absolute;
  bottom: 14px;
  width: 78%;
  height: 24px;
  border-radius: 50%;
  border: 2px solid rgba(80,160,255,.8);
  box-shadow:
    0 0 8px #54a6ff,
    0 0 26px rgba(40,120,255,.75),
    0 0 55px rgba(40,120,255,.35);
}

/*
  Bedienung
*/

#controls {
  position: relative;
  z-index: 30;
  padding: 0 24px 26px;
  margin-top: -8px;
}

#inputRow {
  display: grid;
  grid-template-columns: 1fr 82px;
  gap: 12px;
  align-items: center;
}

#messageWrap {
  display: flex;
  align-items: center;
  min-height: 66px;
  padding: 8px 10px 8px 20px;
  border-radius: 34px;
  border: 1px solid #46505e;
  background: rgba(10,14,21,.91);
  backdrop-filter: blur(10px);
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 18px;
}

#messageInput::placeholder {
  color: #9ba2
