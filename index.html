<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sol Holo – HOLO UI 004</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070d">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #03050a;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  position: relative;
  min-height: 100vh;
  max-width: 760px;
  margin: auto;

  background:
    radial-gradient(
      circle at 50% 35%,
      #112238 0%,
      #070b12 38%,
      #020307 75%
    );

  overflow: hidden;
}

#backgroundGlow {
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 18% 44%,
      rgba(255,180,70,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 42%,
      rgba(20,100,255,.12),
      transparent 30%
    );
}

/*
  HEADER
*/

header {
  position: relative;
  z-index: 20;
  padding: 24px 24px 10px;
  text-align: center;
}

#menuButton {
  position: absolute;
  left: 18px;
  top: 22px;

  width: 52px;
  height: 52px;

  border: none;
  background: transparent;

  color: white;
  font-size: 32px;
  cursor: pointer;
}

#onlineState {
  position: absolute;
  right: 20px;
  top: 34px;

  font-size: 15px;
  color: #d6dbe5;
}

#onlineDot {
  color: #41e66e;
}

h1 {
  margin: 0;

  font-size: 40px;
  font-weight: 600;

  text-shadow:
    0 0 22px rgba(255,196,90,.25);
}

#subtitle {
  margin-top: 7px;

  color: #f3c969;
  font-size: 17px;
}

/*
  BEGRÜSSUNG
*/

#greeting {
  position: relative;
  z-index: 10;

  padding: 22px 28px 0;
}

#greetingTitle {
  font-size: 29px;
  margin: 0 0 8px;
}

#greetingText {
  color: #d7dbe2;
  line-height: 1.5;
  font-size: 18px;
  margin: 0;
}

/*
  SOL HOLO CLONE
*/

#solStage {
  position: relative;
  z-index: 4;

  height: min(52vh, 590px);
  min-height: 390px;

  margin-top: -25px;

  display: flex;
  align-items: flex-end;
  justify-content: center;

  overflow: hidden;
}

/*
  Wrapper für den Clone.
  Hier sitzt jetzt auch die Lip-Sync-Schicht.
*/

#solCloneWrap {
  position: relative;

  display: inline-block;

  height: 95%;
  max-width: 100%;

  transform-origin: center bottom;
}

/*
  Originalbild bleibt erhalten.
*/

#solImage {

  width: auto;
