<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Holo – TEST 008</title>

<style>
*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  min-height:100%;
  background:#05070d;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  padding:16px;
}

main{
  max-width:720px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:34px;
  margin:10px 0 6px;
}

.subtitle{
  text-align:center;
  color:#9da7b3;
  margin-bottom:20px;
}

.box{
  margin:18px 0;
  padding:18px;
  border:1px solid #30363d;
  border-radius:18px;
  background:#090d18;
}

#stage{
  min-height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:#05070d;
  overflow:hidden;
}

#avatarImage{
  max-width:100%;
  max-height:520px;
  display:none;
}

input,
button,
textarea,
audio{
  width:100%;
  margin-top:12px;
}

textarea{
  min-height:110px;
  resize:vertical;
  padding:14px;
  border-radius:12px;
  border:1px solid #30363d;
  background:#05070d;
  color:white;
  font-size:16px;
}

button{
  padding:16px;
  border:0;
  border-radius:12px;
  background:#245cff;
  color:white;
  font-weight:bold;
  font-size:17px;
}

button:disabled{
  opacity:.5;
}

#status,
#chatStatus{
  text-align:center;
  margin-top:10px;
  color:#9cffb1;
}

#chat{
  margin-top:15px;
  max-height:420px;
  overflow-y:auto;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.message strong{
  display:block;
  margin-bottom:5px;
}

.user-message{
  background:#14264f;
}

.sol-message{
  background:#15271b;
}

.system-message{
  background:#2a2020;
  color:#ffb3b3;
}
</style>
</head>

<body>

<main>

<h1>Sol Holo</h1>
<p class="subtitle">Avatar · Sprache · Langzeitgedächtnis</p>

<section class="box">
  <h2>1. Avatar</h2>

  <input id="imageInput" type="file" accept="image/*">

  <div id="stage">
    <img id="avatarImage
