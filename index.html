<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Holo – TEST 008</title>

<style>
*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  min-height:100%;
  background:#05070d;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  padding:16px;
}

main{
  max-width:720px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:34px;
  margin:10px 0 6px;
}

.subtitle{
  text-align:center;
  color:#9da7b3;
  margin-bottom:20px;
}

.box{
  margin:18px 0;
  padding:18px;
  border:1px solid #30363d;
  border-radius:18px;
  background:#090d18;
}

#stage{
  min-height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:#05070d;
  overflow:hidden;
}

#avatarImage{
  max-width:100%;
  max-height:520px;
  display:none;
}

input,
button,
textarea,
audio{
  width:100%;
  margin-top:12px;
}

textarea{
  min-height:110px;
  resize:vertical;
  padding:14px;
  border-radius:12px;
  border:1px solid #30363d;
  background:#05070d;
  color:white;
  font-size:16px;
}

button{
  padding:16px;
  border:0;
  border-radius:12px;
  background:#245cff;
  color:white;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
}

#status,
#chatStatus{
  text-align:center;
  margin-top:10px;
  color:#9cffb1;
}

#chat{
  margin-top:15px;
  max-height:420px;
  overflow-y:auto;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.message strong{
  display:block;
  margin-bottom:5px;
}

.user-message{
  background:#14264f;
}

.sol-message{
  background:#15271b;
}

.system-message{
  background:#2a2020;
  color:#ffb3b3;
}
</style>
</head>

<body>

<main>

<h1>Sol Holo</h1>

<p class="subtitle">
Avatar · Sprache · Langzeitgedächtnis
</p>

<section class="box">

<h2>1. Avatar</h2>

<input
  id="imageInput"
  type="file"
  accept="image/*"
>

<div id="stage">

<img
  id="avatarImage"
  alt="Sol Holo Avatar"
>

</div>

</section>


<section class="box">

<h2>2. Audio</h2>

<input
  id="audioInput"
  type="file"
  accept="audio/*"
>

<audio
  id="audioPlayer"
  controls>
</audio>

<div id="status">
Bereit.
</div>

</section>


<section class="box">

<h2>3. Mit Sol sprechen</h2>

<textarea
  id="messageInput"
  placeholder="Schreib Sol etwas ...">
</textarea>

<button id="sendButton">
Nachricht an Sol senden
</button>

<button id="memoryButton">
Langzeitgedächtnis anzeigen
</button>

<div id="chatStatus"></div>

<div id="chat"></div>

</section>

</main>


<script>

const imageInput =
  document.getElementById("imageInput");

const avatarImage =
  document.getElementById("avatarImage");

const audioInput =
  document.getElementById("audioInput");

const audioPlayer =
  document.getElementById("audioPlayer");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const memoryButton =
  document.getElementById("memoryButton");

const chat =
  document.getElementById("chat");

const chatStatus =
  document.getElementById("chatStatus");

const status =
  document.getElementById("status");


/*
  Avatar-Bild laden
*/

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    avatarImage.src = url;

    avatarImage.style.display =
      "block";

    status.textContent =
      "Avatar geladen.";
  }
);


/*
  Audio laden
*/

audioInput.addEventListener(
  "change",
  () => {

    const file =
      audioInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    audioPlayer.src = url;

    status.textContent =
      "Audio geladen.";
  }
);


/*
  Nachricht im Chat anzeigen
*/

function addMessage(
  speaker,
  text,
  className
) {

  const element =
    document.createElement("div");

  element.className =
    `message ${className}`;

  const name =
    document.createElement("strong");

  name.textContent =
    speaker;

  const content =
    document.createElement("div");

  content.textContent =
    text;

  element.appendChild(name);

  element.appendChild(content);

  chat.appendChild(element);

  chat.scrollTop =
    chat.scrollHeight;
}


/*
  Nachricht an Sol senden
*/

async function sendMessage(
  forcedMessage = null
) {

  const message =
    String(
      forcedMessage ??
      messageInput.value
    ).trim();

  if (!message) {
    return;
  }


  addMessage(
    "Pam",
    message,
    "user-message"
  );


  if (!forcedMessage) {
    messageInput.value = "";
  }


  sendButton.disabled = true;

  memoryButton.disabled = true;

  chatStatus.textContent =
    "Sol denkt ...";


  try {

    const response =
      await fetch(
        "/sol",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              message: message
            })
        }
      );


    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Der Server hat keine gültige Antwort geliefert."
      );

    }


    if (!response.ok) {

      throw new Error(
        data?.error ||
        "Fehler bei der Anfrage an Sol."
      );

    }


    const answer =
      String(
        data?.answer || ""
      ).trim();


    if (!answer) {

      throw new Error(
        "Sol hat keine Antwort geliefert."
      );

    }


    addMessage(
      "Sol",
      answer,
      "sol-message"
    );


    chatStatus.textContent =
      "Antwort erhalten.";


  } catch (error) {

    console.error(error);


    addMessage(
      "System",
      error?.message ||
      "Unbekannter Fehler.",
      "system-message"
    );


    chatStatus.textContent =
      "Verbindung zu Sol fehlgeschlagen.";

  } finally {

    sendButton.disabled =
      false;

    memoryButton.disabled =
      false;

  }
}


/*
  Nachricht senden
*/

sendButton.addEventListener(
  "click",
  () => {

    sendMessage();

  }
);


/*
  Langzeitgedächtnis abrufen
*/

memoryButton.addEventListener(
  "click",
  () => {

    sendMessage(
      "Sol, was weißt du dauerhaft?"
    );

  }
);


/*
  Enter = senden
  Shift + Enter = neue Zeile
*/

messageInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();

    }

  }
);


/*
  Startmeldung
*/

addMessage(
  "System",
  "Sol Holo ist bereit.",
  "system-message"
);

</script>

</body>
</html>
