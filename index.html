<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Holo – TEST 008</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070d">

<style>
*{
  box-sizing:border-box;
}

html, body{
  margin:0;
  min-height:100%;
  background:#05070d;
  color:white;
  font-family:Arial,sans-serif;
}

body{
  padding:16px;
}

main{
  max-width:720px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:34px;
  margin:10px 0 6px;
}

.subtitle{
  text-align:center;
  color:#9da7b3;
  margin-bottom:20px;
}

.box{
  margin:18px 0;
  padding:18px;
  border:1px solid #30363d;
  border-radius:18px;
  background:#090d18;
}

#stage{
  min-height:320px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:16px;
  background:#05070d;
  overflow:hidden;
}

#avatarImage{
  max-width:100%;
  max-height:520px;
  display:none;
}

input,
button,
textarea,
audio{
  width:100%;
  margin-top:12px;
}

textarea{
  min-height:110px;
  resize:vertical;
  padding:14px;
  border-radius:12px;
  border:1px solid #30363d;
  background:#05070d;
  color:white;
  font-size:16px;
}

button{
  padding:16px;
  border:0;
  border-radius:12px;
  background:#245cff;
  color:white;
  font-weight:bold;
  font-size:17px;
  cursor:pointer;
}

button:disabled{
  opacity:.5;
  cursor:default;
}

.secondary-button{
  background:#30363d;
}

#status,
#chatStatus,
#liveStatus{
  text-align:center;
  margin-top:12px;
  color:#9cffb1;
  line-height:1.4;
}

#chat{
  margin-top:15px;
  max-height:420px;
  overflow-y:auto;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.message strong{
  display:block;
  margin-bottom:5px;
}

.user-message{
  background:#14264f;
}

.sol-message{
  background:#15271b;
}

.system-message{
  background:#2a2020;
  color:#ffb3b3;
}

.live-indicator{
  text-align:center;
  font-size:46px;
  margin:14px 0 4px;
}

.live-hint{
  text-align:center;
  color:#9da7b3;
  line-height:1.5;
}
</style>
</head>

<body>

<main>

<h1>Sol Holo</h1>

<p class="subtitle">
Avatar · Sprache · Langzeitgedächtnis · Live
</p>


<section class="box">

<h2>1. Avatar</h2>

<input
  id="imageInput"
  type="file"
  accept="image/*"
>

<div id="stage">

<img
  id="avatarImage"
  alt="Sol Holo Avatar"
>

</div>

</section>


<section class="box">

<h2>2. Audio</h2>

<input
  id="audioInput"
  type="file"
  accept="audio/*"
>

<audio
  id="audioPlayer"
  controls>
</audio>

<div id="status">
Bereit.
</div>

</section>


<section class="box">

<h2>3. Mit Sol schreiben</h2>

<textarea
  id="messageInput"
  placeholder="Schreib Sol etwas ...">
</textarea>

<button id="sendButton">
Nachricht an Sol senden
</button>

<button id="memoryButton">
Langzeitgedächtnis anzeigen
</button>

<div id="chatStatus"></div>

<div id="chat"></div>

</section>


<section class="box">

<h2>4. Live mit Sol sprechen</h2>

<div class="live-indicator">
🎙️ 🌻
</div>

<p class="live-hint">
Starte ein Live-Gespräch und sprich direkt mit Sol.
Das Mikrofon bleibt während des Gesprächs verbunden.
</p>

<button id="startLiveButton">
Live-Gespräch starten
</button>

<button
  id="stopLiveButton"
  class="secondary-button"
  disabled>
Live-Gespräch beenden
</button>

<div id="liveStatus">
Live-Verbindung noch nicht gestartet.
</div>

<audio
  id="realtimeAudio"
  autoplay>
</audio>

</section>

</main>

/*
  Avatar-Bild laden
*/

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    avatarImage.src = url;

    avatarImage.style.display =
      "block";

    status.textContent =
      "Avatar geladen.";
  }
);


/*
  Audio laden
*/

audioInput.addEventListener(
  "change",
  () => {

    const file =
      audioInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    audioPlayer.src = url;

    status.textContent =
      "Audio geladen.";
  }
);
