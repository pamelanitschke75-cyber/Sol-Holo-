<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sol Holo – HOLO UI 001 DIAG</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070d">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #03050a;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  position: relative;
  min-height: 100vh;
  max-width: 760px;
  margin: auto;
  background:
    radial-gradient(circle at 50% 35%, #112238 0%, #070b12 38%, #020307 75%);
  overflow: hidden;
}

#backgroundGlow {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 18% 44%, rgba(255,180,70,.10), transparent 28%),
    radial-gradient(circle at 85% 42%, rgba(20,100,255,.12), transparent 30%);
}

header {
  position: relative;
  z-index: 20;
  padding: 24px 24px 10px;
  text-align: center;
}

#menuButton {
  position: absolute;
  left: 18px;
  top: 22px;
  width: 52px;
  height: 52px;
  border: none;
  background: transparent;
  color: white;
  font-size: 32px;
  cursor: pointer;
}

#onlineState {
  position: absolute;
  right: 20px;
  top: 34px;
  font-size: 15px;
  color: #d6dbe5;
}

#onlineDot {
  color: #41e66e;
}

h1 {
  margin: 0;
  font-size: 40px;
  font-weight: 600;
  text-shadow: 0 0 22px rgba(255,196,90,.25);
}

#subtitle {
  margin-top: 7px;
  color: #f3c969;
  font-size: 17px;
}

#greeting {
  position: relative;
  z-index: 10;
  padding: 22px 28px 0;
}

#greetingTitle {
  font-size: 29px;
  margin: 0 0 8px;
}

#greetingText {
  color: #d7dbe2;
  line-height: 1.5;
  font-size: 18px;
  margin: 0;
  white-space: pre-wrap;
}

#solStage {
  position: relative;
  z-index: 4;
  height: min(67vh, 720px);
  min-height: 500px;
  margin-top: -45px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}

#solImage {
  display: block;
  max-height: 95%;
  max-width: 100%;
  object-fit: contain;
  object-position: center bottom;
  filter:
    drop-shadow(0 0 8px rgba(70,145,255,.42))
    drop-shadow(0 0 24px rgba(25,105,255,.22));
}

#holoBase {
  position: absolute;
  bottom: 14px;
  width: 78%;
  height: 24px;
  border-radius: 50%;
  border: 2px solid rgba(80,160,255,.8);
  box-shadow:
    0 0 8px #54a6ff,
    0 0 26px rgba(40,120,255,.75),
    0 0 55px rgba(40,120,255,.35);
}

#controls {
  position: relative;
  z-index: 30;
  padding: 0 24px 26px;
  margin-top: -8px;
}

#inputRow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px;
  gap: 10px;
  align-items: center;
}

#messageWrap {
  display: flex;
  align-items: center;
  min-height: 66px;
  padding: 8px 10px 8px 20px;
  border-radius: 34px;
  border: 1px solid #46505e;
  background: rgba(10,14,21,.91);
  backdrop-filter: blur(10px);
}

#messageInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  background: transparent;
  color: white;
  font-size: 18px;
}

#messageInput::placeholder {
  color: #9ba2ae;
}

#sendButton {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: none;
  background: transparent;
  color: #64a9ff;
  font-size: 28px;
  cursor: pointer;
}

#liveButton {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  border: 2px solid #f0c76d;
  background:
    radial-gradient(circle, #443016 0%, #17130c 66%);
  color: white;
  font-size: 32px;
  cursor: pointer;
  box-shadow:
    0 0 10px rgba(255,204,90,.35),
    0 0 30px rgba(255,190,60,.16);
}

#liveButton.listening {
  border-color: #58df8a;
  box-shadow:
    0 0 12px rgba(65,230,110,.45),
    0 0 36px rgba(65,230,110,.22);
}

#liveStatus {
  margin-top: 18px;
  min-height: 30px;
  text-align: center;
  color: #f2c75e;
  font-size: 18px;
  white-space: pre-wrap;
}

.wave {
  letter-spacing: 3px;
  color: #d99e28;
  opacity: .8;
}

#drawer {
  position: fixed;
  z-index: 100;
  top: 0;
  left: -320px;
  width: 300px;
  height: 100vh;
  padding: 32px 22px;
  background: #090d15;
  border-right: 1px solid #303744;
  transition: left .25s ease;
  box-shadow: 12px 0 40px rgba(0,0,0,.4);
}

#drawer.open {
  left: 0;
}

.drawerButton {
  width: 100%;
  margin-top: 14px;
  padding: 16px;
  border: 1px solid #384151;
  border-radius: 14px;
  background: #141a24;
  color: white;
  font-size: 17px;
  text-align: left;
  cursor: pointer;
}

#memoryStatus,
#chatStatus,
#micStatus {
  margin-top: 15px;
  color: #aeb7c6;
  line-height: 1.45;
  font-size: 14px;
}

#chat {
  display: none;
}

@media (max-width: 520px) {
  h1 {
    font-size: 34px;
  }

  #subtitle {
    font-size: 15px;
  }

  #greeting {
    padding-left: 24px;
  }

  #greetingTitle {
    font-size: 27px;
  }

  #solStage {
    height: 62vh;
    min-height: 470px;
  }
}
</style>
</head>

<body>

<div id="app">

<div id="backgroundGlow"></div>

<header>

<button
  id="menuButton"
  type="button"
  aria-label="Menü">
☰
</button>

<h1>Sol Holo 🌻</h1>

<div id="subtitle">
Deine KI. Dein Holo. Immer für dich da.
</div>

<div id="onlineState">
<span id="onlineDot">●</span>
Online
</div>

</header>

<section id="greeting">

<h2 id="greetingTitle">
Hallo Pam 💛
</h
