<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sol Holo</title>

  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0f1117;
      color: #e6edf3;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
    }

    .subtitle {
      color: #9da7b3;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      box-sizing: border-box;
      padding: 12px;
      margin-top: 14px;
      font-size: 17px;
      border-radius: 8px;
    }

    button {
      margin-top: 12px;
      padding: 12px 22px;
      font-size: 17px;
      cursor: pointer;
      border-radius: 8px;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      font-weight: bold;
    }

    #answer {
      margin-top: 15px;
      padding: 14px;
      background: #181c24;
      border-radius: 8px;
      text-align: left;
      min-height: 40px;
    }

    iframe {
      width: 100%;
      height: 520px;
      margin-top: 16px;
      border: 0;
      border-radius: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Sol Holo</h1>

    <p class="subtitle">
      Pam → Sol / ChatGPT → Antwort → Stimme → LipSync → Sol Holo
    </p>

    <textarea
      id="question"
      placeholder="Frag Sol etwas ..."
    ></textarea>

    <br>

    <button id="askButton">
      Sol fragen
    </button>

    <div id="status">
      Bereit.
    </div>

    <div id="answer">
      Sols Antwort erscheint hier.
    </div>

    <iframe
      id="livespeak"
      src="https://metaperson.avatarsdk.com/livespeak/index.html?mode=tts_azure3&lang=German"
      allow="autoplay; microphone"
      title="Sol Holo">
    </iframe>

  </div>

  <script>

    /*
      WICHTIG:

      Hier kommt später NUR die öffentliche
      Internetadresse des Sol-Holo-Backends hinein.

      KEIN OPENAI API-KEY!
    */

    const BACKEND_URL =
      "https://DEIN-BACKEND.example.com";


    const question =
      document.getElementById("question");

    const askButton =
      document.getElementById("askButton");

    const status =
      document.getElementById("status");

    const answer =
      document.getElementById("answer");

    const avatar =
      document.getElementById("livespeak");


    let liveSpeakReady = false;


    /*
      Nachrichten von MetaPerson LiveSpeak empfangen.
    */

    window.addEventListener(
      "message",
      function(event) {

        const data = event.data;

        if (!data) {
          return;
        }


        /*
          LiveSpeak wurde geladen.
        */

        if (
          data.source === "livespeak" &&
          data.eventName === "livespeak_loaded"
        ) {

          liveSpeakReady = true;

          status.textContent =
            "Sol Holo ist bereit.";

          return;
        }


        /*
          Status des Avatars.
        */

        if (
          data.source === "livespeak" &&
          data.eventName === "avatar_state_changed"
        ) {

          if (data.avatarState === "Speaking") {

            status.textContent =
              "Sol Holo spricht …";

          }

          else if (data.avatarState === "Thinking") {

            status.textContent =
              "Sprachausgabe wird vorbereitet …";

          }

          else if (data.avatarState === "Ready") {

            status.textContent =
              "Bereit.";

          }

          return;
        }


        /*
          Fehler aus LiveSpeak.
        */

        if (
          data.source === "livespeak" &&
          data.eventName === "message_processing_error"
        ) {

          status.textContent =
            "Avatar-Fehler: " +
            (data.reason || "Unbekannter Fehler");

        }

      }
    );


    /*
      Pam stellt Sol eine Frage.
    */

    async function askSol() {

      const text =
        question.value.trim();


      if (!text) {

        status.textContent =
          "Bitte zuerst etwas fragen.";

        return;
      }


      askButton.disabled = true;

      status.textContent =
        "Sol denkt …";

      answer.textContent = "";


      try {

        /*
          Pams Frage geht an das
          Sol-Holo-Backend.

          Das Backend verbindet sich
          anschließend sicher mit OpenAI.
        */

        const response =
          await fetch(
            BACKEND_URL + "/sol",
            {
              method: "POST",

              headers: {
                "Content-Type": "application/json"
              },

              body: JSON.stringify({
                message: text
              })
            }
          );


        let data;

        try {

          data = await response.json();

        }

        catch {

          throw new Error(
            "Das Backend hat keine gültige Antwort geliefert."
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Backend-Fehler"
          );

        }


        const solAnswer =
          String(data.answer || "").trim();


        if (!solAnswer) {

          throw new Error(
            "Sol hat keine Textantwort geliefert."
          );

        }


        /*
          Sols Antwort wird auf der
          Sol-Holo-Seite angezeigt.
        */

        answer.textContent =
          solAnswer;


        /*
          Sols fertige Antwort wird
          an MetaPerson LiveSpeak übergeben.

          WICHTIG:

          Der MetaPerson-Chatbot erzeugt
          hier NICHT die Antwort.

          Die Antwort stammt von Sol/OpenAI.

          MetaPerson übernimmt anschließend
          Sprachausgabe und LipSync.
        */

        if (liveSpeakReady) {

          avatar.contentWindow.postMessage(
            {
              eventName: "speak",
              text: solAnswer
            },
            "*"
          );

          status.textContent =
            "Sol Holo spricht …";

        }

        else {

          status.textContent =
            "Sols Antwort ist da. Der Avatar lädt noch.";

        }

      }

      catch (error) {

        console.error(error);

        status.textContent =
          "Fehler: " +
          error.message;

      }

      finally {

        askButton.disabled = false;

      }

    }


    /*
      Button:
      Sol fragen
    */

    askButton.addEventListener(
      "click",
      askSol
    );


    /*
      Enter = Frage absenden

      Shift + Enter =
      neue Zeile schreiben
    */

    question.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          askSol();

        }

      }
    );

  </script>

</body>
</html
