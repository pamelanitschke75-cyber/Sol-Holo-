<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sol Holo – TEST 008</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#05070d">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #05070d;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  padding: 16px;
}

main {
  max-width: 720px;
  margin: auto;
}

h1 {
  text-align: center;
  font-size: 34px;
  margin: 10px 0 6px;
}

.subtitle {
  text-align: center;
  color: #9da7b3;
  margin-bottom: 20px;
}

.box {
  margin: 18px 0;
  padding: 18px;
  border: 1px solid #30363d;
  border-radius: 18px;
  background: #090d18;
}

#stage {
  min-height: 320px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 16px;
  background: #05070d;
  overflow: hidden;
}

#avatarImage {
  max-width: 100%;
  max-height: 520px;
  display: none;
}

input,
button,
textarea,
audio {
  width: 100%;
  margin-top: 12px;
}

textarea {
  min-height: 110px;
  resize: vertical;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #30363d;
  background: #05070d;
  color: white;
  font-size: 16px;
}

button {
  padding: 16px;
  border: 0;
  border-radius: 12px;
  background: #245cff;
  color: white;
  font-weight: bold;
  font-size: 17px;
  cursor: pointer;
}

button:disabled {
  opacity: 0.5;
  cursor: default;
}

.secondary-button {
  background: #30363d;
}

#status,
#chatStatus,
#liveStatus {
  text-align: center;
  margin-top: 12px;
  color: #9cffb1;
  line-height: 1.4;
}

#chat {
  margin-top: 15px;
  max-height: 420px;
  overflow-y: auto;
}

.message {
  margin: 10px 0;
  padding: 12px 14px;
  border-radius: 14px;
  line-height: 1.45;
  white-space: pre-wrap;
}

.message strong {
  display: block;
  margin-bottom: 5px;
}

.user-message {
  background: #14264f;
}

.sol-message {
  background: #15271b;
}

.system-message {
  background: #2a2020;
  color: #ffb3b3;
}

.live-indicator {
  text-align: center;
  font-size: 46px;
  margin: 14px 0 4px;
}

.live-hint {
  text-align: center;
  color: #9da7b3;
  line-height: 1.5;
}
</style>
</head>

<body>

<main>

<h1>Sol Holo</h1>

<p class="subtitle">
Avatar · Sprache · Langzeitgedächtnis · Live
</p>

<section class="box">

<h2>1. Avatar</h2>

<input
  id="imageInput"
  type="file"
  accept="image/*"
>

<div id="stage">

<img
  id="avatarImage"
  alt="Sol Holo Avatar"
>

</div>

</section>

<section class="box">

<h2>2. Audio</h2>

<input
  id="audioInput"
  type="file"
  accept="audio/*"
>

<audio
  id="audioPlayer"
  controls>
</audio>

<div id="status">
Bereit.
</div>

</section>

<section class="box">

<h2>3. Mit Sol schreiben</h2>

<textarea
  id="messageInput"
  placeholder="Schreib Sol etwas ...">
</textarea>

<button id="sendButton">
Nachricht an Sol senden
</button>

<button id="memoryButton">
Langzeitgedächtnis anzeigen
</button>

<div id="chatStatus"></div>

<div id="chat"></div>

</section>

<section class="box">

<h2>4. Live mit Sol sprechen</h2>

<div class="live-indicator">
🎙️ 🌻
</div>

<p class="live-hint">
Starte ein Live-Gespräch und sprich direkt mit Sol.
</p>

<button id="startLiveButton">
Live-Gespräch starten
</button>

<button
  id="stopLiveButton"
  class="secondary-button"
  disabled>
Live-Gespräch beenden
</button>

<div id="liveStatus">
Live-Verbindung noch nicht gestartet.
</div>

<audio
  id="realtimeAudio"
  autoplay>
</audio>

</section>

</main>

<script>

const BACKEND_URL =
  "https://sol-holo.onrender.com";

/*
  Elemente
*/

const imageInput =
  document.getElementById("imageInput");

const avatarImage =
  document.getElementById("avatarImage");

const audioInput =
  document.getElementById("audioInput");

const audioPlayer =
  document.getElementById("audioPlayer");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const memoryButton =
  document.getElementById("memoryButton");

const chat =
  document.getElementById("chat");

const chatStatus =
  document.getElementById("chatStatus");

const status =
  document.getElementById("status");

const startLiveButton =
  document.getElementById("startLiveButton");

const stopLiveButton =
  document.getElementById("stopLiveButton");

const liveStatus =
  document.getElementById("liveStatus");

const realtimeAudio =
  document.getElementById("realtimeAudio");

/*
  Live-Status
*/

let pc = null;
let dc = null;
let microphoneStream = null;

/*
  Avatar laden
*/

imageInput.addEventListener(
  "change",
  () => {

    const file =
      imageInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    avatarImage.src = url;
    avatarImage.style.display = "block";

    status.textContent =
      "Avatar geladen.";
  }
);

/*
  Audio laden
*/

audioInput.addEventListener(
  "change",
  () => {

    const file =
      audioInput.files?.[0];

    if (!file) {
      return;
    }

    const url =
      URL.createObjectURL(file);

    audioPlayer.src = url;

    status.textContent =
      "Audio geladen.";
  }
);

/*
  Chat-Nachricht anzeigen
*/

function addMessage(
  speaker,
  text,
  className
) {

  const element =
    document.createElement("div");

  element.className =
    `message ${className}`;

  const name =
    document.createElement("strong");

  name.textContent =
    speaker;

  const content =
    document.createElement("div");

  content.textContent =
    text;

  element.appendChild(name);
  element.appendChild(content);

  chat.appendChild(element);

  chat.scrollTop =
    chat.scrollHeight;
}

/*
  Textnachricht senden
*/

async function sendMessage(
  forcedMessage = null
) {

  const message =
    String(
      forcedMessage ??
      messageInput.value
    ).trim();

  if (!message) {
    return;
  }

  addMessage(
    "Pam",
    message,
    "user-message"
  );

  if (!forcedMessage) {
    messageInput.value = "";
  }

  sendButton.disabled = true;
  memoryButton.disabled = true;

  chatStatus.textContent =
    "Sol denkt ...";

  try {

    const response =
      await fetch(
        `${BACKEND_URL}/sol`,
        {
          method: "POST",
          headers: {
            "Content-Type":
              "application/json"
          },
          body:
            JSON.stringify({
              message
            })
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      throw new Error(
        data?.error ||
        "Fehler bei der Anfrage an Sol."
      );
    }

    const answer =
      String(
        data?.answer || ""
      ).trim();

    if (!answer) {

      throw new Error(
        "Sol hat keine Antwort geliefert."
      );
    }

    addMessage(
      "Sol",
      answer,
      "sol-message"
    );

    chatStatus.textContent =
      "Antwort erhalten.";

  } catch (error) {

    console.error(error);

    addMessage(
      "System",
      error?.message ||
      "Unbekannter Fehler.",
      "system-message"
    );

    chatStatus.textContent =
      "Verbindung zu Sol fehlgeschlagen.";

  } finally {

    sendButton.disabled = false;
    memoryButton.disabled = false;
  }
}

/*
  Text-Buttons
*/

sendButton.addEventListener(
  "click",
  () => {
    sendMessage();
  }
);

memoryButton.addEventListener(
  "click",
  () => {
    sendMessage(
      "Sol, was weißt du dauerhaft?"
    );
  }
);

messageInput.addEventListener(
  "keydown",
  (event) => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }
);

/*
  Live-Gespräch beenden
*/

function stopLiveConversation() {

  if (dc) {

    try {
      dc.close();
    } catch {}

    dc = null;
  }

  if (pc) {

    try {
      pc.close();
    } catch {}

    pc = null;
  }

  if (microphoneStream) {

    microphoneStream
      .getTracks()
      .forEach(
        (track) => track.stop()
      );

    microphoneStream = null;
  }

  realtimeAudio.srcObject = null;

  startLiveButton.disabled = false;
  stopLiveButton.disabled = true;
}

/*
  Live-Gespräch starten
*/

async function startLiveConversation() {

  if (pc) {
    return;
  }

  startLiveButton.disabled = true;

  liveStatus.textContent =
    "Sol Live wird vorbereitet ...";

  try {

    /*
      Kurzlebigen Realtime-Schlüssel
      vom Render-Backend holen
    */

    const tokenResponse =
      await fetch(
        `${BACKEND_URL}/realtime/token`,
        {
          method: "GET",
          cache: "no-store"
        }
      );

    const tokenData =
      await tokenResponse.json();

    if (!tokenResponse.ok) {

      throw new Error(
        tokenData?.error ||
        "Realtime-Schlüssel konnte nicht erstellt werden."
      );
    }

    const ephemeralKey =
      String(
        tokenData?.value || ""
      ).trim();

    if (!ephemeralKey) {

      throw new Error(
        "Kein Realtime-Schlüssel erhalten."
      );
    }

    liveStatus.textContent =
      "Mikrofon wird geöffnet ...";

    /*
      WebRTC
    */

    pc =
      new RTCPeerConnection();

    /*
      Sols Audio
    */

    pc.ontrack =
      (event) => {

        const stream =
          event.streams?.[0];

        if (!stream) {
          return;
        }

        realtimeAudio.srcObject =
          stream;

        realtimeAudio
          .play()
          .catch(() => {});
      };

    /*
      Mikrofon
    */

    microphoneStream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });

    const audioTrack =
      microphoneStream
        .getAudioTracks()[0];

    if (!audioTrack) {

      throw new Error(
        "Kein Mikrofon gefunden."
      );
    }

    pc.addTrack(
      audioTrack,
      microphoneStream
    );

    /*
      Realtime Event Channel
    */

    dc =
      pc.createDataChannel(
        "oai-events"
      );

    dc.addEventListener(
      "open",
      () => {

        liveStatus.textContent =
          "🌻 Sol hört zu – sprich einfach.";

        stopLiveButton.disabled =
          false;
      }
    );

    dc.addEventListener(
      "message",
      (event) => {

        try {

          const realtimeEvent =
            JSON.parse(
              event.data
            );

          console.log(
            "Realtime:",
            realtimeEvent
          );

          if (
            realtimeEvent.type ===
            "input_audio_buffer.speech_started"
          ) {

            liveStatus.textContent =
              "🎙️ Sol hört dich ...";
          }

          if (
            realtimeEvent.type ===
            "input_audio_buffer.speech_stopped"
          ) {

            liveStatus.textContent =
              "🌻 Sol antwortet ...";
          }

          if (
            realtimeEvent.type ===
            "response.done"
          ) {

            liveStatus.textContent =
              "🌻 Sol hört zu – sprich einfach.";
          }

          if (
            realtimeEvent.type ===
            "error"
          ) {

            console.error(
              "Realtime-Fehler:",
              realtimeEvent
            );

            liveStatus.textContent =
              "Realtime-Fehler.";
          }

        } catch (error) {

          console.error(
            "Realtime-Nachricht konnte nicht gelesen werden:",
            error
          );
        }
      }
    );

    /*
      Verbindung beobachten
    */

    pc.addEventListener(
      "connectionstatechange",
      () => {

        console.log(
          "WebRTC:",
          pc?.connectionState
        );

        if (
          pc?.connectionState ===
          "connected"
        ) {

          liveStatus.textContent =
            "🌻 Live verbunden – sprich mit Sol.";

          stopLiveButton.disabled =
            false;
        }

        if (
          pc?.connectionState ===
            "failed" ||
          pc?.connectionState ===
            "closed"
        ) {

          stopLiveConversation();

          liveStatus.textContent =
            "Live-Verbindung beendet.";
        }
      }
    );

    /*
      SDP Offer erstellen
    */

    const offer =
      await pc.createOffer();

    await pc.setLocalDescription(
      offer
    );

    /*
      Mit OpenAI Realtime verbinden
    */

    const sdpResponse =
      await fetch(
        "https://api.openai.com/v1/realtime/calls",
        {
          method: "POST",

          body:
            offer.sdp,

          headers: {
            Authorization:
              `Bearer ${ephemeralKey}`,

            "Content-Type":
              "application/sdp"
          }
        }
      );

    const answerSdp =
      await sdpResponse.text();

    if (!sdpResponse.ok) {

      console.error(
        "SDP-Fehler:",
        answerSdp
      );

      throw new Error(
        "Live-Verbindung zu Sol konnte nicht aufgebaut werden."
      );
    }

    /*
      Antwort setzen
    */

    await pc.setRemoteDescription({
      type: "answer",
      sdp: answerSdp
    });

    liveStatus.textContent =
      "🌻 Verbindung wird hergestellt ...";

  } catch (error) {

    console.error(
      "Sol-Holo-Live-Fehler:",
      error
    );

    stopLiveConversation();

    liveStatus.textContent =
      error?.message ||
      "Live-Gespräch konnte nicht gestartet werden.";
  }
}

/*
  Live-Buttons
*/

startLiveButton.addEventListener(
  "click",
  () => {
    startLiveConversation();
  }
);

stopLiveButton.addEventListener(
  "click",
  () => {

    stopLiveConversation();

    liveStatus.textContent =
      "Live-Gespräch beendet.";
  }
);

/*
  Startmeldung
*/

addMessage(
  "System",
  "Sol Holo ist bereit.",
  "system-message"
);

/*
  Service Worker
*/

if ("serviceWorker" in navigator) {

  window.addEventListener(
    "load",
    () => {

      navigator.serviceWorker
        .register(
          "/service-worker.js"
        )
        .catch(
          (error) => {

            console.error(
              "Service Worker konnte nicht registriert werden:",
              error
            );
          }
        );
    }
  );
}

</script>

</body>
</html>
