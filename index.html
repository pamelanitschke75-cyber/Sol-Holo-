<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Sol Holo – TEST 006</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow-y: auto;
      background: #05070d;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      margin: 8px 0 4px;
      text-align: center;
      font-size: 30px;
    }

    .subtitle {
      margin: 0 0 14px;
      text-align: center;
      color: #9da7b3;
      line-height: 1.4;
    }

    .box {
      margin-bottom: 14px;
      padding: 14px;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 14px;
    }

    #status {
      text-align: center;
      font-weight: bold;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #diagnostics {
      margin-top: 10px;
      color: #9da7b3;
      font-size: 13px;
      line-height: 1.65;
    }

    button,
    input {
      width: 100%;
      min-height: 50px;
      margin-top: 10px;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    input {
      color: #ffffff;
      background: #161b22;
      border: 1px solid #30363d;
    }

    #avatar {
      width: 100%;
      height: 380px;
      margin-bottom: 14px;
      overflow: hidden;
      background: #080b24;
      border: 1px solid #30363d;
      border-radius: 16px;
      touch-action: pan-y;
    }

    #avatar canvas {
      touch-action: pan-y !important;
    }

    .success {
      color: #9cffb1;
    }

    .error {
      color: #ff9
