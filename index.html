<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sol Holo – TEST 007</title>

<style>
body{
  margin:0;
  padding:16px;
  background:#05070d;
  color:white;
  font-family:Arial,sans-serif;
}

main{
  max-width:700px;
  margin:auto;
}

h1{
  text-align:center;
  font-size:34px;
}

p{
  text-align:center;
  color:#9da7b3;
}

.box{
  margin:18px 0;
  padding:18px;
  border:1px solid #30363d;
  border-radius:18px;
}

input,
button,
audio,
textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:12px;
}

button{
  padding:16px;
  border:0;
  border-radius:12px;
  background:#245cff;
  color:white;
  font-weight:bold;
  font-size:17px;
}

button:disabled{
  opacity:.4;
}

textarea{
  min-height:110px;
  resize:vertical;
  padding:14px;
  border-radius:12px;
  border:1px solid #30363d;
  background:#090d18;
  color:white;
  font-size:16px;
}

#stage{
  position:relative;
  min-height:350px;
  margin-top:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-radius:16px;
  background:#090d18;
}

#avatar{
  display:none;
  max-width:100%;
  max-height:520px;
  transition:transform .05s linear;
}

#mouth{
  display:none;
  position:absolute;
  left:50%;
  top:66%;
  width:45px;
  height:8px;
  background:#351018;
  border-radius:50%;
  transform:translate(-50%,-50%);
}

#status{
  text-align:center;
  font-weight:bold;
  color:#9cffb1;
}

#chat{
  margin-top:15px;
  max-height:420px;
  overflow-y:auto;
}

.message{
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.45;
  white-space:pre-wrap;
}

.user-message{
  background:#14264f;
}

.sol-message{
  background:#15271b;
}

.system-message{
  background:#2a2020;
  color:#ffb3b3;
}

.message strong{
  display:block;
  margin-bottom:5px;
}

#chatStatus{
  margin-top:10px;
  text-align:center;
  color:#9da7b3;
  min-height:20px;
}
</style
