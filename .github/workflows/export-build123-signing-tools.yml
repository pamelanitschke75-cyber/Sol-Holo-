name: Export Android signing tools for Build 123

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/export-build123-signing-tools.yml"

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Collect official Android signing tools
        run: |
          set -Eeuo pipefail
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/zipalign"
          test -s "$build_tools/lib/apksigner.jar"
          test -d "$build_tools/lib64"

          mkdir -p signing-tools/lib
          cp -- "$build_tools/apksigner" signing-tools/apksigner
          cp -- "$build_tools/zipalign" signing-tools/zipalign
          cp -- "$build_tools/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp -a -- "$build_tools/lib64" signing-tools/lib64
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Upload tools temporarily
        uses: actions/upload-artifact@v4
        with:
          name: Android-signing-tools-build123
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
