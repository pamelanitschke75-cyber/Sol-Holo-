name: Publish Pam's Holo Build 127 Background Wake

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-build127-background-wake.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Download and verify original-signed APK
        env:
          SOURCE_URL: "https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-9c28-81fd-9db8-e21654f35d30/raw?se=2026-09-03T13%3A41%3A26Z&sp=r&sv=2026-02-06&sr=b&scid=01a06739-c930-7b71-825d-ec11d0a975bb&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-02T21%3A26%3A51Z&ske=2026-09-03T21%3A26%3A51Z&sks=b&skv=2026-02-06&sig=dymkiF2xz/a1OFbQL1zXd7XbGZd16HcDGVdsvafcfHE%3D"
          EXPECTED_APK_SHA256: "9a90ddc6db1a4455f6c4c3a73004a25c17db6cf26f9feee6c53f6de894d4ac99"
          EXPECTED_CERT_SHA256: "e122201077b93cb47edb6951446fb8dff77427a2f5a2bd4719474a638fe803e9"
        run: |
          set -Eeuo pipefail
          apk="Pams-Holo-Build-127-S23-Hey-Pam-Hintergrund-original-signiert.apk"
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output "$apk"
          echo "$EXPECTED_APK_SHA256  $apk" | sha256sum --check
          unzip -tq "$apk"

          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$build_tools/zipalign" -c -p 4 "$apk"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk" | tee apk-verification.txt
          grep -Fq "Verified using v1 scheme (JAR signing): true" apk-verification.txt
          grep -Fq "Verified using v2 scheme (APK Signature Scheme v2): true" apk-verification.txt
          grep -Fq "Verified using v3 scheme (APK Signature Scheme v3): true" apk-verification.txt
          grep -Fq "V3.0 Signer: certificate SHA-256 digest: $EXPECTED_CERT_SHA256" apk-verification.txt

          "$build_tools/aapt" dump badging "$apk" | tee apk-badging.txt
          grep -Fq "package: name='com.solholo.app' versionCode='127'" apk-badging.txt
          test "$(unzip -Z1 "$apk" | awk -F/ '/^lib\// {print $2}' | sort -u)" = "arm64-v8a"
          unzip -p "$apk" assets/capacitor.config.json | grep -Fq '"appId": "com.solholo.app"'
          unzip -p "$apk" assets/public/SPEAKER_IDENTITY_SOURCES.txt | grep -Fq 'Owner-Bindung: pam-sol'
          unzip -p "$apk" assets/sol-kws-keywords.txt | grep -Fxq 'HH EY1 P AE1 M @Hey_Pam'
          unzip -p "$apk" assets/sol-kws-keywords.txt | grep -Fxq 'HH AY1 P AE1 M @Hai_Pam'
          ! unzip -p "$apk" assets/sol-kws-keywords.txt | grep -Fq '@Hey_Sol'

          for dex in classes*.dex; do
            unzip -p "$apk" "$dex" | strings
          done > dex-strings.txt
          grep -Fq 'setPendingIntentCreatorBackgroundActivityStartMode' dex-strings.txt
          grep -Fq 'setPendingIntentBackgroundActivityStartMode' dex-strings.txt

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: "0ad10cfa60ff63867b5e1b64805495f463ce92dc"
        run: |
          set -Eeuo pipefail
          tag="pams-holo-build-127-s23-hey-pam-hintergrund-original-signiert"
          apk="Pams-Holo-Build-127-S23-Hey-Pam-Hintergrund-original-signiert.apk"

          cat > release-notes.md <<'NOTES'
          Originalsigniertes Update für Pams Galaxy S23.

          Persönlicher Weckruf:
          - Pams Holo hört ausschließlich auf „Hey Pam“.
          - Keyword und Pams Besitzerstimme werden weiterhin vollständig lokal geprüft.
          - Der Modus „App offen“ wurde von Pam mit Build 125 zweimal erfolgreich bestätigt.

          Reparierter Hintergrund-Übergang:
          - Android 14 erhält die ausdrückliche Absenderfreigabe für den Background Activity Launch.
          - Android 15 erhält zusätzlich die ausdrückliche Erstellerfreigabe des PendingIntent.
          - Der bisherige direkte Start bleibt als zeitversetzter Rückfallweg erhalten.
          - Die Benachrichtigung bietet bei einer Android-Blockade zusätzlich „Sol öffnen“.

          Unverändert:
          - Paket com.solholo.app und Owner pam-sol
          - vorhandene 3/3-Stimmproben, Hey-Pam-Vorlage, Einstellungen, Vollzeitgedächtnis und App-Daten
          - beide lokalen Sprecher-Sicherheitsmodelle und sämtliche Annahmeschwellen

          Technische Prüfung:
          - GitHub Build 127 vollständig grün
          - 104/104 App-Tests bestanden
          - APK-SHA-256: 9a90ddc6db1a4455f6c4c3a73004a25c17db6cf26f9feee6c53f6de894d4ac99
          - Zertifikat-SHA-256 wie Build 89: e122201077b93cb47edb6951446fb8dff77427a2f5a2bd4719474a638fe803e9
          - APK Signature Schemes V1, V2 und V3 bestätigt
          - nur arm64-v8a für Pams Galaxy S23
          - S23-Hintergrund-Praxisstatus: offen, bis Pam den installierten Build bestätigt
          - Sperrbildschirmtest folgt erst nach bestandenem Hintergrundtest
          NOTES

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --target "$TARGET_COMMIT" --title "Pam's Holo Build 127 · Hey Pam im Hintergrund · S23 · originalsigniert" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --target "$TARGET_COMMIT" --title "Pam's Holo Build 127 · Hey Pam im Hintergrund · S23 · originalsigniert" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY"
          fi

