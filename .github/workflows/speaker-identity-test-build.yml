name: Sol Holo · Hey Sol Stimmen-Test APK

on:
  workflow_dispatch:

jobs:
  speaker-identity-test:
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: App nach Android synchronisieren
        run: npx cap sync android

      - name: Bestehende Sol-Holo-Android-Funktionen einbinden
        run: node scripts/install-whatsapp-driving-mode.mjs

      - name: Lokale Sprechererkennung einbinden
        run: node scripts/install-speaker-identity.mjs

      - name: Einbindung und Quellen prüfen
        run: |
          set -Eeuo pipefail
          test -s android/app/libs/sherpa-onnx-1.13.4.aar
          test -s android/app/src/main/assets/sol-speaker-model.onnx
          test -s android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt
          grep -q "SolSpeakerIdentityPlugin.class" android/app/src/main/java/com/solholo/app/MainActivity.java
          grep -q "sherpa-onnx-1.13.4.aar" android/app/build.gradle
          grep -q "Keine Verbindung, Partnerschaft oder Billigung" android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Test-APK bauen
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sprecherkomponenten im APK prüfen
        run: |
          set -Eeuo pipefail
          apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$apk"
          unzip -l "$apk" | grep -F "assets/sol-speaker-model.onnx"
          unzip -l "$apk" | grep -F "assets/public/SPEAKER_IDENTITY_SOURCES.txt"
          unzip -p "$apk" assets/public/SPEAKER_IDENTITY_SOURCES.txt | grep -q "sherpa-onnx 1.13.4"

      - name: Signaturmodus bestimmen
        id: signing
        env:
          SOL_HOLO_KEYSTORE_BASE64: ${{ secrets.SOL_HOLO_KEYSTORE_BASE64 }}
          SOL_HOLO_KEYSTORE_PASSWORD: ${{ secrets.SOL_HOLO_KEYSTORE_PASSWORD }}
          SOL_HOLO_KEY_ALIAS: ${{ secrets.SOL_HOLO_KEY_ALIAS }}
          SOL_HOLO_KEY_PASSWORD: ${{ secrets.SOL_HOLO_KEY_PASSWORD }}
        run: |
          if [[ -n "$SOL_HOLO_KEYSTORE_BASE64" && -n "$SOL_HOLO_KEYSTORE_PASSWORD" && -n "$SOL_HOLO_KEY_ALIAS" && -n "$SOL_HOLO_KEY_PASSWORD" ]]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
          else
            echo "mode=neuinstallation" >> "$GITHUB_OUTPUT"
          fi

      - name: Mit dauerhafter Sol-Holo-Signatur signieren
        if: steps.signing.outputs.mode == 'update'
        env:
          SOL_HOLO_KEYSTORE_BASE64: ${{ secrets.SOL_HOLO_KEYSTORE_BASE64 }}
          SOL_HOLO_KEYSTORE_PASSWORD: ${{ secrets.SOL_HOLO_KEYSTORE_PASSWORD }}
          SOL_HOLO_KEY_ALIAS: ${{ secrets.SOL_HOLO_KEY_ALIAS }}
          SOL_HOLO_KEY_PASSWORD: ${{ secrets.SOL_HOLO_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/speaker-test-aligned.apk"
          key="$RUNNER_TEMP/sol-holo.jks"
          signed="android/app/build/outputs/apk/release/Pams-Holo-Hey-Sol-Stimmentest-Update.apk"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          printf '%s' "$SOL_HOLO_KEYSTORE_BASE64" | base64 --decode > "$key"
          "$tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$SOL_HOLO_KEY_ALIAS" --ks-pass env:SOL_HOLO_KEYSTORE_PASSWORD --key-pass env:SOL_HOLO_KEY_PASSWORD --pass-encoding utf-8 --out "$signed" "$aligned"
          "$tools/apksigner" verify --verbose "$signed"
          rm -f "$key" "$aligned"

      - name: Test-APK für Neuinstallation signieren
        if: steps.signing.outputs.mode == 'neuinstallation'
        run: |
          set -Eeuo pipefail
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned="$RUNNER_TEMP/speaker-test-aligned.apk"
          key="$RUNNER_TEMP/speaker-test.p12"
          signed="android/app/build/outputs/apk/release/Pams-Holo-Hey-Sol-Stimmentest-Neuinstallation.apk"
          pass="$(openssl rand -hex 24)"
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          keytool -genkeypair -keystore "$key" -storetype PKCS12 -storepass "$pass" -keypass "$pass" -alias speaker-test -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Sol Holo Hey Sol Stimmentest, O=Sol Holo, C=DE" >/dev/null 2>&1
          "$tools/zipalign" -p -f 4 "$unsigned" "$aligned"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias speaker-test --ks-pass pass:"$pass" --key-pass pass:"$pass" --out "$signed" "$aligned"
          "$tools/apksigner" verify --verbose "$signed"
          rm -f "$key" "$aligned"

      - name: APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Holo-Hey-Sol-Stimmentest-${{ steps.signing.outputs.mode }}
          path: android/app/build/outputs/apk/release/Pams-Holo-Hey-Sol-Stimmentest-*.apk
