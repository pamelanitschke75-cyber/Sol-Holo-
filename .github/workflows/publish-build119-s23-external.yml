name: Publish Pam's Holo Build 119 S23

on:
  push:
    paths:
      - .github/workflows/publish-build119-s23-external.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify signed APK
        env:
          SOURCE_URL: "https://oaisdmntprwestus3.blob.core.windows.net/files/00000000-f890-81fd-9f73-39145b335619/raw?se=2026-09-02T21%3A54%3A03Z&sp=r&sv=2026-02-06&sr=b&scid=01a063e4-2aa4-7af5-a05e-e39e6da2fa11&skoid=0a4a0f0c-99ac-4752-9d87-cfac036fa93f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-01T22%3A22%3A40Z&ske=2026-09-02T22%3A22%3A40Z&sks=b&skv=2026-02-06&sig=s%2BiUKrx9f/ftqKKcz8EOMoMzUZhcCqSvYgG%2Bbtofkl0%3D"
        run: |
          set -euo pipefail
          apk='Pams-Holo-Build-119-S23-original-signiert.apk'
          curl --fail --location --retry 3 --retry-delay 2 "$SOURCE_URL" --output "$apk"
          echo '26dd799e8e108ddabda756d4d594648323a3798c04290ceac4631b9b9dde7c41  '"$apk" | sha256sum --check
      - name: Publish external download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag='pams-holo-build-119-s23'
          apk='Pams-Holo-Build-119-S23-original-signiert.apk'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "$apk" --repo "$GITHUB_REPOSITORY" --title "Pam's Holo Build 119 · Galaxy S23" --notes "Originalsigniertes Update für Pams Galaxy S23. Wake-Phrase: Hey Sol. Signaturen: V1, V2 und V3."
          fi
