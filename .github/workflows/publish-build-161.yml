name: Publish Pam's Holo Build 161

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-build-161.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Build 161 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33974344427 \
            --repo "${{ github.repository }}" \
            --name "Pams-Holo-Android-update" \
            --dir artifact

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" "Pams-Holo-Update-Build-161-Alltagsworker.apk"
          sha256sum "Pams-Holo-Update-Build-161-Alltagsworker.apk"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-161-alltagsworker"
          asset="Pams-Holo-Update-Build-161-Alltagsworker.apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$asset" \
              --repo "${{ github.repository }}" \
              --target "c1f2f8c65a94f209ac27b09284049c0b1bac34b5" \
              --title "Pam's Holo – Alltagsworker Build 161" \
              --notes "Originalsigniertes Android-Update aus dem erfolgreichen main-Build #161. Installation als Update; vorhandene App nicht deinstallieren."
          fi
