name: Sol Holo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/logo.png"
      - "www/icon-192.png"
      - "www/icon-512.png"
      - "www/manifest.json"
      - "www/index.html"
      - "www/headaudio.min.mjs"
      - "www/headworklet.min.mjs"
      - "www/full-face-rig.mjs"
      - "www/model-en-mixed.b64"
      - "www/media-tools.js"
      - "www/sol-holo-logo.png"
      - "www/sol-holo-ui.css"
      - "www/sol-holo-ui.js"
      - "www/service-worker.js"
      - "www/third-party/**"
      - "package.json"
      - "package-lock.json"
      - "android-native/**"
      - "scripts/install-full-face-rig-assets.mjs"
      - "scripts/install-whatsapp-driving-mode.mjs"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Fortlaufende Build-Version setzen
        env:
          SOL_HOLO_VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text(encoding="utf-8")
          version_code = os.environ["SOL_HOLO_VERSION_CODE"]

          updated, replacements = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              rf"\1versionCode {version_code}",
              text,
              count=1,
          )

          if replacements != 1:
              raise SystemExit("Android-versionCode konnte nicht eindeutig gesetzt werden.")

          build_file.write_text(updated, encoding="utf-8")
          print(f"Sol-Holo-versionCode: {version_code}")
          PY

      - name: SH♾️-App-Symbol erzeugen
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#020714" \
            --iconBackgroundColorDark "#020714" \
            --splashBackgroundColor "#020714" \
            --splashBackgroundColorDark "#020714"

      - name: Sol Holo Web-App nach Android synchronisieren
        run: npx cap sync android

      - name: Sicheren Fahr- und Weckmodus einbinden
        run: node scripts/install-whatsapp-driving-mode.mjs

      - name: Mikrofon-Berechtigungen setzen
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          if marker not in text:
              raise SystemExit("Manifest-Tag nicht gefunden.")

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + permission,
                      1
                  )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("Alle Mikrofon-Berechtigungen sind gesetzt.")
          PY

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Sol Holo Release-APK bauen
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Sol Holo APK für Neuinstallation signieren und prüfen
        run: |
          set -Eeuo pipefail

          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="$RUNNER_TEMP/Sol-Holo-aligned.apk"
          keystore_file="$RUNNER_TEMP/Sol-Holo-Neuinstallation.p12"
          signed_apk="android/app/build/outputs/apk/release/Sol-Holo.apk"
          key_alias="sol-holo-neuinstallation"
          SOL_HOLO_BUILD_PASSWORD="$(openssl rand -hex 24)"
          export SOL_HOLO_BUILD_PASSWORD
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          test -f "$unsigned_apk"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"

          keytool -genkeypair \
            -keystore "$keystore_file" \
            -storetype PKCS12 \
            -storepass "$SOL_HOLO_BUILD_PASSWORD" \
            -keypass "$SOL_HOLO_BUILD_PASSWORD" \
            -alias "$key_alias" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10000 \
            -dname "CN=Sol Holo Neuinstallation, O=Sol Holo, C=DE" \
            >/dev/null 2>&1

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"

          "$build_tools/apksigner" sign \
            --ks "$keystore_file" \
            --ks-key-alias "$key_alias" \
            --ks-pass env:SOL_HOLO_BUILD_PASSWORD \
            --key-pass env:SOL_HOLO_BUILD_PASSWORD \
            --pass-encoding utf-8 \
            --out "$signed_apk" \
            "$aligned_apk"

          "$build_tools/apksigner" verify --verbose --print-certs "$signed_apk"

          rm -f "$keystore_file" "$aligned_apk"
          SOL_HOLO_BUILD_PASSWORD=""

      - name: Sol Holo Android APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Holo-Android
          path: android/app/build/outputs/apk/release/Sol-Holo.apk
