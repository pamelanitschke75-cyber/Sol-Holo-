name: Sol Holo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/logo.png"
      - "www/icon-192.png"
      - "www/icon-512.png"
      - "www/manifest.json"
      - "www/index.html"
      - "www/sol-holo-logo.png"
      - "www/sol-holo-ui.css"
      - "www/sol-holo-ui.js"
      - "www/service-worker.js"
      - "package.json"
      - "android-native/**"
      - "scripts/install-whatsapp-driving-mode.mjs"

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: SH♾️-App-Symbol erzeugen
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#020714" \
            --iconBackgroundColorDark "#020714" \
            --splashBackgroundColor "#020714" \
            --splashBackgroundColorDark "#020714"

      - name: Sol Holo Web-App nach Android synchronisieren
        run: npx cap sync android

      - name: Sicheren Fahr- und Weckmodus einbinden
        run: node scripts/install-whatsapp-driving-mode.mjs

      - name: Mikrofon-Berechtigungen setzen
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          if marker not in text:
              raise SystemExit("Manifest-Tag nicht gefunden.")

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + permission,
                      1
                  )

          manifest.write_text(text, encoding="utf-8")
          print("Alle Mikrofon-Berechtigungen sind gesetzt.")
          PY

      - name: Versionsnummer für echte Updates erhöhen
        env:
          SOL_HOLO_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text(encoding="utf-8")

          run_number = int(os.environ["SOL_HOLO_RUN_NUMBER"])
          version_code = 1000 + run_number
          version_name = f"1.0.{run_number}"

          text, code_count = re.subn(
              r'(?m)^(\s*)versionCode\s+\d+\s*$',
              lambda match: f"{match.group(1)}versionCode {version_code}",
              text,
              count=1
          )
          text, name_count = re.subn(
              r'(?m)^(\s*)versionName\s+"[^"]*"\s*$',
              lambda match: f'{match.group(1)}versionName "{version_name}"',
              text,
              count=1
          )

          if code_count != 1 or name_count != 1:
              raise SystemExit("Android-Versionsfelder wurden nicht eindeutig gefunden.")

          gradle.write_text(text, encoding="utf-8")
          print(f"Sol Holo Version {version_name} (Code {version_code})")
          PY

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Festen Signierschlüssel sicher laden
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_SIGNING_PASSWORD" ]; then
            echo "::error title=App-Signatur fehlt::Die geschützten Android-Signierdaten sind noch nicht vollständig hinterlegt."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/sol-holo-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$ANDROID_SIGNING_PASSWORD" \
            -alias "sol-holo" \
            >/dev/null

      - name: Release-APK bauen
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Release-APK dauerhaft signieren und prüfen
        env:
          ANDROID_SIGNING_PASSWORD: ${{ secrets.ANDROID_SIGNING_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR="$(dirname "$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)")"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/Sol-Holo-aligned.apk"
          SIGNED_APK="android/app/build/outputs/apk/release/Sol-Holo.apk"

          if [ ! -x "$BUILD_TOOLS_DIR/apksigner" ] || [ ! -x "$BUILD_TOOLS_DIR/zipalign" ]; then
            echo "::error title=Android-Build-Tools fehlen::apksigner oder zipalign wurde nicht gefunden."
            exit 1
          fi

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error title=Release-APK fehlt::Die unsignierte Release-APK wurde nicht erzeugt."
            exit 1
          fi

          "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/sol-holo-release.jks" \
            --ks-key-alias "sol-holo" \
            --ks-pass env:ANDROID_SIGNING_PASSWORD \
            --key-pass env:ANDROID_SIGNING_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify \
            --verbose \
            --print-certs \
            "$SIGNED_APK"

      - name: Signierte Sol Holo APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Holo-Android
          path: android/app/build/outputs/apk/release/Sol-Holo.apk
          if-no-files-found: error
