name: Sol Holo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Mikrofon-Berechtigung setzen
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          text = manifest.read_text(encoding="utf-8")

          permission = '<uses-permission android:name="android.permission.RECORD_AUDIO" />'

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + permission,
                      1
                  )
              else:
                  raise SystemExit("Manifest-Tag nicht gefunden.")

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("RECORD_AUDIO-Berechtigung ist gesetzt.")
          PY

      - name: Sol Holo Web-App nach Android synchronisieren
        run: npx cap sync android

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sol Holo APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Holo-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk