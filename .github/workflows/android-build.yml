name: Pam’s Holo Android APK · Sol Holo

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/**"
      - "www/**"
      - "android-native/**"
      - "wear-native/**"
      - "scripts/**"
      - "modules/**"
      - "tests/**"
      - "licenses/**"
      - "server.mjs"
      - "video-upload-security.mjs"
      - "package.json"
      - "package-lock.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/logo.png"
      - "www/icon-192.png"
      - "www/icon-512.png"
      - "www/manifest.json"
      - "www/index.html"
      - "www/app-lock-bootstrap.mjs"
      - "www/trusted-app-session.mjs"
      - "www/headaudio.min.mjs"
      - "www/headworklet.min.mjs"
      - "www/full-face-rig.mjs"
      - "www/consent-signature.mjs"
      - "www/consent-ui-bootstrap.mjs"
      - "www/model-en-mixed.b64"
      - "www/media-tools.js"
      - "www/sol-holo-logo.png"
      - "www/sol-motion-profile.js"
      - "www/sol-holo-ui.css"
      - "www/sol-holo-wow.css"
      - "www/sol-holo-chat-115.css"
      - "www/sol-holo-backup-core.mjs"
      - "www/sol-holo-backup.css"
      - "www/sol-holo-backup.mjs"
      - "www/sol-holo-ui.js"
      - "www/service-worker.js"
      - "www/third-party/**"
      - "server.mjs"
      - "video-upload-security.mjs"
      - "modules/**"
      - "licenses/**"
      - "package.json"
      - "package-lock.json"
      - "android-native/**"
      - "wear-native/**"
      - "tests/*.test.mjs"
      - "tests/java/**"
      - "scripts/check-samsung-notes-language.mjs"
      - "scripts/generate-third-party-licenses.mjs"
      - "scripts/audit-android-runtime-licenses.mjs"
      - "scripts/install-full-face-rig-assets.mjs"
      - "scripts/install-access-security.mjs"
      - "scripts/install-speaker-identity.mjs"
      - "scripts/install-wear-companion.mjs"
      - "scripts/install-whatsapp-driving-mode.mjs"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Sprecher-Sicherheitslogik testen
        run: |
          set -Eeuo pipefail
          test_dir="$RUNNER_TEMP/speaker-policy-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" \
            android-native/SpeakerVerificationPolicy.java \
            tests/java/com/solholo/app/SpeakerVerificationPolicyTest.java
          java -cp "$test_dir" com.solholo.app.SpeakerVerificationPolicyTest
          javac -d "$test_dir" \
            android-native/WakePhraseMatcher.java \
            tests/java/com/solholo/app/WakePhraseMatcherTest.java
          java -cp "$test_dir" com.solholo.app.WakePhraseMatcherTest
          javac -d "$test_dir" \
            android-native/WakeVoiceTemplateSelector.java \
            tests/java/com/solholo/app/WakeVoiceTemplateSelectorTest.java
          java -cp "$test_dir" com.solholo.app.WakeVoiceTemplateSelectorTest
          javac -d "$test_dir" \
            android-native/WakeCaptureEndpointer.java \
            tests/java/com/solholo/app/WakeCaptureEndpointerTest.java
          java -cp "$test_dir" com.solholo.app.WakeCaptureEndpointerTest
          javac -d "$test_dir" \
            android-native/PcmRingBuffer.java \
            tests/java/com/solholo/app/PcmRingBufferTest.java
          java -cp "$test_dir" com.solholo.app.PcmRingBufferTest
          javac -d "$test_dir" \
            android-native/WakeRecognitionLifecyclePolicy.java \
            tests/java/com/solholo/app/WakeRecognitionLifecyclePolicyTest.java
          java -cp "$test_dir" com.solholo.app.WakeRecognitionLifecyclePolicyTest
          javac -d "$test_dir" \
            android-native/WearWakePayloadPolicy.java \
            tests/java/com/solholo/app/WearWakePayloadPolicyTest.java
          java -cp "$test_dir" com.solholo.app.WearWakePayloadPolicyTest

      - name: Mehrfaktor-Sicherheitslogik testen
        run: |
          set -Eeuo pipefail
          if command -v javac >/dev/null 2>&1; then
            test_dir="$RUNNER_TEMP/security-factor-policy-test"
            mkdir -p "$test_dir"
            javac -d "$test_dir" \
              android-native/SecurityFactorPolicy.java \
              tests/java/com/solholo/app/SecurityFactorPolicyTest.java
            java -cp "$test_dir" com.solholo.app.SecurityFactorPolicyTest
          else
            echo "Kein JDK-Compiler vorhanden; reiner Java-Policy-Test wird übersprungen."
          fi

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Stille Modultests ausführen
        run: node --test tests/*.test.mjs

      - name: NPM-Sicherheitsbericht ausgeben
        continue-on-error: true
        run: |
          empty_audit='{"metadata":{"vulnerabilities":{}},"vulnerabilities":{}}'

          timeout 60s npm audit --json > npm-audit-all.json || true
          if [ ! -s npm-audit-all.json ]; then
            printf '%s\n' "$empty_audit" > npm-audit-all.json
          fi

          timeout 60s npm audit --omit=dev --json > npm-audit-runtime.json || true
          if [ ! -s npm-audit-runtime.json ]; then
            printf '%s\n' "$empty_audit" > npm-audit-runtime.json
          fi
          node - <<'NODE'
          const fs = require('fs');

          function printReport(label, file) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities || {};
            console.log(`\n===== ${label} =====`);
            console.log(
              `low=${counts.low || 0}, moderate=${counts.moderate || 0}, ` +
              `high=${counts.high || 0}, critical=${counts.critical || 0}, ` +
              `total=${counts.total || 0}`
            );

            const vulnerabilities = Object.values(report.vulnerabilities || {})
              .sort((a, b) => String(a.name).localeCompare(String(b.name)));

            for (const vulnerability of vulnerabilities) {
              console.log(
                `\n${vulnerability.name} | severity=${vulnerability.severity} | ` +
                `direct=${Boolean(vulnerability.isDirect)} | range=${vulnerability.range || ''}`
              );

              for (const cause of vulnerability.via || []) {
                if (typeof cause === 'string') {
                  console.log(`  via package: ${cause}`);
                  continue;
                }
                console.log(
                  `  advisory: ${cause.title || ''} | ` +
                  `severity=${cause.severity || ''} | range=${cause.range || ''}`
                );
                if (cause.url) console.log(`  ${cause.url}`);
              }

              if (vulnerability.effects?.length) {
                console.log(`  effects: ${vulnerability.effects.join(', ')}`);
              }
              console.log(`  fixAvailable: ${JSON.stringify(vulnerability.fixAvailable)}`);
            }
          }

          printReport('ALLE NPM-ABHÄNGIGKEITEN', 'npm-audit-all.json');
          printReport('NUR RUNTIME / OHNE DEV-ABHÄNGIGKEITEN', 'npm-audit-runtime.json');
          NODE

      - name: Erzeugte Drittanbieter-Lizenzdateien prüfen
        run: |
          set -Eeuo pipefail
          test -s THIRD_PARTY_LICENSES.txt
          test -s NPM_LICENSE_INVENTORY.txt
          test -s www/THIRD_PARTY_LICENSES.txt
          test -s www/NPM_LICENSE_INVENTORY.txt
          test -s www/third-party/HeadAudio-LICENSE.txt
          test -s www/third-party/APACHE-2.0.txt
          test -s www/mediapipe/MODIFICATION_NOTICE.txt
          grep -q "SOL HOLO MODIFICATION NOTICE" www/mediapipe/vision_bundle.mjs
          grep -q "@mediapipe/tasks-vision" www/THIRD_PARTY_LICENSES.txt
          grep -q "@capacitor/android" www/THIRD_PARTY_LICENSES.txt
          grep -q "HeadAudio browser lip-sync components" www/THIRD_PARTY_LICENSES.txt
          grep -q "@trapezedev/project" www/NPM_LICENSE_INVENTORY.txt
          grep -q "url-template" www/NPM_LICENSE_INVENTORY.txt

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: Fortlaufende Build-Version setzen
        env:
          SOL_HOLO_VERSION_CODE: ${{ github.run_number }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          build_file = Path("android/app/build.gradle")
          text = build_file.read_text(encoding="utf-8")
          version_code = os.environ["SOL_HOLO_VERSION_CODE"]

          updated, replacements = re.subn(
              r"(?m)^(\s*)versionCode\s+\d+\s*$",
              rf"\1versionCode {version_code}",
              text,
              count=1,
          )

          if replacements != 1:
              raise SystemExit("Android-versionCode konnte nicht eindeutig gesetzt werden.")

          build_file.write_text(updated, encoding="utf-8")
          print(f"Sol-Holo-versionCode: {version_code}")
          PY

      - name: SH♾️-App-Symbol erzeugen
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#020714" \
            --iconBackgroundColorDark "#020714" \
            --splashBackgroundColor "#020714" \
            --splashBackgroundColorDark "#020714"

      - name: Pam’s Holo App nach Android synchronisieren
        run: npx cap sync android

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Drittanbieter-Lizenzen in Android-Assets prüfen
        run: |
          set -Eeuo pipefail
          test -s android/app/src/main/assets/public/THIRD_PARTY_LICENSES.txt
          test -s android/app/src/main/assets/public/NPM_LICENSE_INVENTORY.txt
          test -s android/app/src/main/assets/public/third-party/HeadAudio-LICENSE.txt
          test -s android/app/src/main/assets/public/third-party/APACHE-2.0.txt
          test -s android/app/src/main/assets/public/mediapipe/MODIFICATION_NOTICE.txt
          grep -q "SOL HOLO MODIFICATION NOTICE" \
            android/app/src/main/assets/public/mediapipe/vision_bundle.mjs

      - name: Android-Laufzeitabhängigkeiten und Lizenzen prüfen
        run: |
          set -Eeuo pipefail
          (
            cd android
            ./gradlew app:dependencies --configuration releaseRuntimeClasspath
          ) > android-runtime-dependencies.txt
          node scripts/audit-android-runtime-licenses.mjs \
            android-runtime-dependencies.txt \
            android/app/src/main/assets/public
          test -s ANDROID_RUNTIME_LICENSES.txt
          test -s android/app/src/main/assets/public/ANDROID_RUNTIME_LICENSES.txt
          test -s android/app/src/main/assets/public/ANDROID_RUNTIME_DEPENDENCIES.txt

      - name: Sicheren Fahr- und Weckmodus einbinden
        run: node scripts/install-whatsapp-driving-mode.mjs

      - name: Mehrfaktor-Zugriffssicherheit einbinden
        run: node scripts/install-access-security.mjs

      - name: Verschlüsselte Sicherung und Ausschlüsse prüfen
        run: |
          set -Eeuo pipefail
          app_java="android/app/src/main/java/com/solholo/app/MainActivity.java"
          backup_java="android/app/src/main/java/com/solholo/app/SolBackupPlugin.java"
          backup_rules="android/app/src/main/res/xml/sol_holo_backup_rules.xml"
          extraction_rules="android/app/src/main/res/xml/sol_holo_data_extraction_rules.xml"
          public_assets="android/app/src/main/assets/public"

          test -s "$backup_java"
          test -s "$public_assets/sol-holo-backup-core.mjs"
          test -s "$public_assets/sol-holo-backup.mjs"
          test -s "$public_assets/sol-holo-backup.css"
          grep -q "registerPlugin(SolBackupPlugin.class)" "$app_java"
          grep -q "Intent.ACTION_CREATE_DOCUMENT" "$backup_java"
          grep -q "Intent.ACTION_OPEN_DOCUMENT" "$backup_java"
          grep -q "sol_holo_access_security_v1_pam-sol.xml" "$backup_rules"
          grep -q "sol_holo_speaker_identity.xml" "$backup_rules"
          grep -q "sol_holo_access_security_v1_pam-sol.xml" "$extraction_rules"
          grep -q "sol_holo_speaker_identity.xml" "$extraction_rules"
          ! grep -q "READ_EXTERNAL_STORAGE\|WRITE_EXTERNAL_STORAGE" "$backup_java"

      - name: Direkte Samsung-Notes-Übergabe prüfen
        run: |
          set -Eeuo pipefail
          node scripts/check-samsung-notes-language.mjs
          notes_js="android/app/src/main/assets/public/sol-holo-ui.js"
          trusted_session_js="android/app/src/main/assets/public/trusted-app-session.mjs"
          app_html="android/app/src/main/assets/public/index.html"
          notes_java="android/app/src/main/java/com/solholo/app/PhoneContactsPlugin.java"
          app_manifest="android/app/src/main/AndroidManifest.xml"
          test -s "$notes_js"
          test -s "$trusted_session_js"
          test -s "$app_html"
          test -s "$notes_java"
          test -s "$app_manifest"
          grep -q 'Bitte dort noch speichern' "$notes_js"
          grep -q 'samsungNoteInsertionFromNaturalRequest' "$notes_js"
          grep -q 'samsungNoteTextFromNaturalRequest' "$notes_js"
          grep -q 'notes?|noten|notizen' "$notes_js"
          grep -q 'prepareSamsungNote' "$notes_js"
          grep -q 'prepareSamsungNote' "$notes_java"
          grep -q 'com.google.android.gms.actions.CREATE_NOTE' "$notes_java"
          grep -q 'com.google.android.gms.actions.extra.TEXT' "$notes_java"
          grep -q 'ClipData.newPlainText' "$notes_java"
          grep -q 'com.samsung.android.app.notes' "$notes_java"
          grep -q 'com.samsung.android.app.notes' "$app_manifest"
          grep -q 'create_personal_note' "$notes_js"
          grep -q 'REALTIME_NOTE_TOOL_NAMES' "$app_html"
          grep -q 'create_personal_note' server.mjs
          grep -q 'Schreib bitte Zucker in Notes' server.mjs
          grep -q 'Verlange niemals' server.mjs
          grep -q 'x-sol-holo-trusted-session' "$trusted_session_js"
          grep -q 'signTrustedSessionChallenge' \
            android/app/src/main/java/com/solholo/app/SolAccessSecurityPlugin.java

      - name: Lokale Sprechererkennung in Pam’s Holo einbinden
        run: node scripts/install-speaker-identity.mjs

      - name: Pam auf der Galaxy Watch8 einbinden
        run: node scripts/install-wear-companion.mjs

      - name: Getrennten Watch8-Begleiter und sichere Kopplung prüfen
        run: |
          set -Eeuo pipefail
          phone_manifest="android/app/src/main/AndroidManifest.xml"
          watch_manifest="android/wear/src/main/AndroidManifest.xml"
          watch_java="android/wear/src/main/java/com/solholo/app"

          test -s "$watch_manifest"
          test -s "$watch_java/WatchMainActivity.java"
          test -s "$watch_java/WatchWakeService.java"
          test -s "$watch_java/WatchBridgeListenerService.java"
          test -s "$watch_java/WatchRestartReceiver.java"
          test -s "$watch_java/WearWakePayloadPolicy.java"
          test -s android/wear/libs/sherpa-onnx-1.13.4.aar
          test -s android/wear/src/main/assets/sol-kws-encoder.int8.onnx
          test -s android/wear/src/main/assets/sol-kws-decoder.onnx
          test -s android/wear/src/main/assets/sol-kws-joiner.int8.onnx
          test -s android/wear/src/main/assets/sol-kws-tokens.txt
          test -s android/wear/src/main/assets/sol-kws-keywords.txt
          test -s android/wear/src/main/assets/WEAR_DATA_LAYER_SOURCES.txt
          test -s android/app/src/main/assets/public/WEAR_DATA_LAYER_SOURCES.txt

          grep -q "include ':wear'" android/settings.gradle
          grep -q 'applicationId "com.solholo.app"' android/wear/build.gradle
          grep -q 'play-services-wearable:20.0.1' android/wear/build.gradle
          grep -q 'play-services-wearable:20.0.1' android/app/build.gradle
          grep -q 'android.hardware.type.watch' "$watch_manifest"
          grep -q 'com.google.android.wearable.standalone' "$watch_manifest"
          grep -q 'android:value="false"' "$watch_manifest"
          grep -q 'android:foregroundServiceType="microphone"' "$watch_manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_MICROPHONE' "$watch_manifest"
          grep -q 'android.permission.RECORD_AUDIO' "$watch_manifest"
          grep -q 'PhoneWearWakeListenerService' "$phone_manifest"
          grep -q '/solholo/watch/wake/' "$phone_manifest"

          grep -q 'SolSpeakerIdentityPlugin.verifyWakeAudio' \
            android/app/src/main/java/com/solholo/app/PhoneWearWakeListenerService.java
          grep -q 'HeyHoSolService.acceptVerifiedWearWake' \
            android/app/src/main/java/com/solholo/app/PhoneWearWakeListenerService.java
          grep -q 'MAX_AGE_MILLIS = 30_000L' \
            "$watch_java/WearWakePayloadPolicy.java"
          grep -q 'MAX_PCM_BYTES = MAX_SAMPLE_COUNT \* 2' \
            "$watch_java/WearWakePayloadPolicy.java"
          grep -q 'node.isNearby()' "$watch_java/WatchWakeService.java"
          grep -q 'request.setUrgent()' "$watch_java/WatchWakeService.java"
          grep -q 'Pam ist da · sie spricht jetzt über dein Handy' \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          ! grep -q 'startForegroundService\|WatchWakeService.ACTION_START' \
            "$watch_java/WatchRestartReceiver.java"

      - name: Sprechererkennung in der Original-App prüfen
        run: |
          set -Eeuo pipefail
          test -s android/app/libs/sherpa-onnx-1.13.4.aar
          test -s android/app/src/main/assets/sol-speaker-campplus.onnx
          test -s android/app/src/main/assets/sol-speaker-eres2net.onnx
          test -s android/app/src/main/assets/sol-kws-encoder.int8.onnx
          test -s android/app/src/main/assets/sol-kws-decoder.onnx
          test -s android/app/src/main/assets/sol-kws-joiner.int8.onnx
          test -s android/app/src/main/assets/sol-kws-tokens.txt
          test -s android/app/src/main/assets/sol-kws-keywords.txt
          test -s android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt
          test -s android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          test -s android/app/src/main/java/com/solholo/app/PcmRingBuffer.java
          test -s android/app/src/main/java/com/solholo/app/SolWakeKeywordSpotter.java
          grep -q "registerPlugin(SolSpeakerIdentityPlugin.class)" \
            android/app/src/main/java/com/solholo/app/MainActivity.java
          grep -q "sherpa-onnx-1.13.4.aar" android/app/build.gradle
          grep -q "357a834f702b80161e5b981182c038e18553c1f2ca752ed6cec2052365d4129b" \
            android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt
          grep -q "c59158379255ad66e161679cca6af8d52d51e389e3224ab7d7a7baae295c2db5" \
            android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt
          grep -q "68447f4fbc67e70eee3a93961f36e81e98f47aef73ce7e7ca00885c6cd3616a6" \
            android/app/src/main/assets/public/SPEAKER_IDENTITY_SOURCES.txt
          grep -Fxq "HH EY1 P AE1 M @Hey_Pam" \
            android/app/src/main/assets/sol-kws-keywords.txt
          grep -Fxq "HH AY1 P AE1 M @Hai_Pam" \
            android/app/src/main/assets/sol-kws-keywords.txt
          grep -Fxq "HH EY1 P EH1 M @Hey_Pamm" \
            android/app/src/main/assets/sol-kws-keywords.txt
          grep -Fxq "HH AY1 P EH1 M @Hai_Pamm" \
            android/app/src/main/assets/sol-kws-keywords.txt
          grep -q "securityGateEnabled" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "CAMPPLUS_SANITY_FLOOR = 0.10f" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "ERES2NET_OWNER_THRESHOLD = 0.58f" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "WAKE_DUAL_CAMPPLUS_THRESHOLD = CAMPPLUS_SANITY_FLOOR" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "WAKE_DUAL_ERES2NET_THRESHOLD = 0.48f" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "WAKE_TEMPLATE_CAMPPLUS_THRESHOLD = 0.50f" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "WAKE_TEMPLATE_ERES2NET_THRESHOLD = 0.50f" \
            android/app/src/main/java/com/solholo/app/SpeakerVerificationPolicy.java
          grep -q "SpeakerVerificationPolicy.isWakeTemplateOwner" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "wakeVoiceReady" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          test -s \
            android/app/src/main/java/com/solholo/app/WakeVoiceTemplateSelector.java
          grep -q "SpeakerVerificationPolicy.isWakeOwner" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "normalizedCentroid" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "verifyWakeAudio" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "new SolWakeKeywordSpotter" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q "MediaRecorder.AudioSource.MIC" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          ! grep -q "MediaRecorder.AudioSource.VOICE_RECOGNITION" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q "MediaRecorder.AudioSource.MIC" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          ! grep -q "MediaRecorder.AudioSource.VOICE_RECOGNITION" \
            android/app/src/main/java/com/solholo/app/SolSpeakerIdentityPlugin.java
          grep -q "keywordSpotter.accept" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q "new PcmRingBuffer" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q "new KeywordSpotterConfig" \
            android/app/src/main/java/com/solholo/app/SolWakeKeywordSpotter.java
          ! grep -q "android.speech.SpeechRecognizer" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          ! grep -q "RecognizerIntent.EXTRA_AUDIO_SOURCE" \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q '"owner_accepted"' \
            android/app/src/main/java/com/solholo/app/HeyHoSolService.java
          grep -q "isProcessingAudio" \
