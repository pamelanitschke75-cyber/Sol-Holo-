name: Sol Holo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/android-build.yml"
      - "assets/logo.png"
      - "www/icon-192.png"
      - "www/icon-512.png"
      - "www/manifest.json"
      - "www/index.html"
      - "www/sol-holo-logo.png"
      - "www/sol-holo-ui.css"
      - "www/sol-holo-ui.js"
      - "www/service-worker.js"
      - "package.json"

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Node-Abhängigkeiten installieren
        run: npm install

      - name: Android-Projekt erzeugen
        run: npx cap add android

      - name: SH♾️-App-Symbol erzeugen
        run: |
          npx @capacitor/assets generate \
            --android \
            --assetPath assets \
            --iconBackgroundColor "#020714" \
            --iconBackgroundColorDark "#020714" \
            --splashBackgroundColor "#020714" \
            --splashBackgroundColorDark "#020714"

      - name: Sol Holo Web-App nach Android synchronisieren
        run: npx cap sync android

      - name: Mikrofon-Berechtigungen setzen
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")

          marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          permissions = [
              '<uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '<uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />'
          ]

          if marker not in text:
              raise SystemExit("Manifest-Tag nicht gefunden.")

          for permission in permissions:
              if permission not in text:
                  text = text.replace(
                      marker,
                      marker + '\n    ' + permission,
                      1
                  )

          manifest.write_text(
              text,
              encoding="utf-8"
          )

          print("Alle Mikrofon-Berechtigungen sind gesetzt.")
          PY

      - name: Gradle ausführbar machen
        run: chmod +x android/gradlew

      - name: Debug-APK bauen
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Sol Holo APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Sol-Holo-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
