      - name: Signaturmodus sicher bestimmen
        id: signing_mode
        env:
          SOL_HOLO_KEYSTORE_BASE64: ${{ secrets.SOL_HOLO_KEYSTORE_BASE64 }}
          SOL_HOLO_KEYSTORE_PASSWORD: ${{ secrets.SOL_HOLO_KEYSTORE_PASSWORD }}
          SOL_HOLO_KEY_ALIAS: ${{ secrets.SOL_HOLO_KEY_ALIAS }}
          SOL_HOLO_KEY_PASSWORD: ${{ secrets.SOL_HOLO_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          if [[
            -n "$SOL_HOLO_KEYSTORE_BASE64" &&
            -n "$SOL_HOLO_KEYSTORE_PASSWORD" &&
            -n "$SOL_HOLO_KEY_ALIAS" &&
            -n "$SOL_HOLO_KEY_PASSWORD"
          ]]; then
            echo "mode=update" >> "$GITHUB_OUTPUT"
            echo "Dauerhafte Sol-Holo-Update-Signatur ist vollständig."
          else
            echo "mode=extern_signieren" >> "$GITHUB_OUTPUT"
            echo "Keine Wegwerf-Signatur: APK wird nur als unsignierte Signierquelle bereitgestellt."
          fi

      - name: Pam’s Holo Handy-, Watch8- und Play-Pakete dauerhaft signieren und prüfen
        if: steps.signing_mode.outputs.mode == 'update'
        env:
          SOL_HOLO_KEYSTORE_BASE64: ${{ secrets.SOL_HOLO_KEYSTORE_BASE64 }}
          SOL_HOLO_KEYSTORE_PASSWORD: ${{ secrets.SOL_HOLO_KEYSTORE_PASSWORD }}
          SOL_HOLO_KEY_ALIAS: ${{ secrets.SOL_HOLO_KEY_ALIAS }}
          SOL_HOLO_KEY_PASSWORD: ${{ secrets.SOL_HOLO_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail

          phone_unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          watch_unsigned_apk="android/wear/build/outputs/apk/release/wear-release-unsigned.apk"
          phone_unsigned_aab="android/app/build/outputs/bundle/release/app-release.aab"
          watch_unsigned_aab="android/wear/build/outputs/bundle/release/wear-release.aab"
          phone_aligned_apk="$RUNNER_TEMP/Sol-Holo-phone-aligned.apk"
          watch_aligned_apk="$RUNNER_TEMP/Sol-Holo-watch-aligned.apk"
          keystore_file="$RUNNER_TEMP/Sol-Holo-Update-Key.jks"
          phone_signed_apk="android/app/build/outputs/apk/release/Pams-Holo-Update.apk"
          watch_signed_apk="android/wear/build/outputs/apk/release/Pams-Holo-Watch8.apk"
          phone_signed_aab="android/app/build/outputs/bundle/release/Pams-Holo-Handy-Play.aab"
          watch_signed_aab="android/wear/build/outputs/bundle/release/Pams-Holo-Watch8-Play.aab"
          android_sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$android_sdk"
          build_tools="$(find "$android_sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          : "${SOL_HOLO_KEYSTORE_BASE64:?SOL_HOLO_KEYSTORE_BASE64 fehlt}"
          : "${SOL_HOLO_KEYSTORE_PASSWORD:?SOL_HOLO_KEYSTORE_PASSWORD fehlt}"
          : "${SOL_HOLO_KEY_ALIAS:?SOL_HOLO_KEY_ALIAS fehlt}"
          : "${SOL_HOLO_KEY_PASSWORD:?SOL_HOLO_KEY_PASSWORD fehlt}"

          cleanup_signing_files() {
            rm -f "$keystore_file" "$phone_aligned_apk" "$watch_aligned_apk"
          }
          trap cleanup_signing_files EXIT

          test -f "$phone_unsigned_apk"
          test -f "$watch_unsigned_apk"
          test -f "$phone_unsigned_aab"
          test -f "$watch_unsigned_aab"
          test -x "$build_tools/zipalign"
          test -x "$build_tools/apksigner"
          command -v jarsigner >/dev/null

          printf '%s' "$SOL_HOLO_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore_file"
          chmod 600 "$keystore_file"

          keytool -list \
            -keystore "$keystore_file" \
            -storepass:env SOL_HOLO_KEYSTORE_PASSWORD \
            -alias "$SOL_HOLO_KEY_ALIAS" \
            >/dev/null 2>&1

          "$build_tools/zipalign" -p -f 4 \
            "$phone_unsigned_apk" "$phone_aligned_apk"
          "$build_tools/zipalign" -p -f 4 \
            "$watch_unsigned_apk" "$watch_aligned_apk"

          "$build_tools/apksigner" sign \
            --ks "$keystore_file" \
            --ks-key-alias "$SOL_HOLO_KEY_ALIAS" \
            --ks-pass env:SOL_HOLO_KEYSTORE_PASSWORD \
            --key-pass env:SOL_HOLO_KEY_PASSWORD \
            --pass-encoding utf-8 \
            --out "$phone_signed_apk" \
            "$phone_aligned_apk"

          "$build_tools/apksigner" sign \
            --ks "$keystore_file" \
            --ks-key-alias "$SOL_HOLO_KEY_ALIAS" \
            --ks-pass env:SOL_HOLO_KEYSTORE_PASSWORD \
            --key-pass env:SOL_HOLO_KEY_PASSWORD \
            --pass-encoding utf-8 \
            --out "$watch_signed_apk" \
            "$watch_aligned_apk"

          jarsigner \
            -keystore "$keystore_file" \
            -storepass:env SOL_HOLO_KEYSTORE_PASSWORD \
            -keypass:env SOL_HOLO_KEY_PASSWORD \
            -signedjar "$phone_signed_aab" \
            "$phone_unsigned_aab" \
            "$SOL_HOLO_KEY_ALIAS"

          jarsigner \
            -keystore "$keystore_file" \
            -storepass:env SOL_HOLO_KEYSTORE_PASSWORD \
            -keypass:env SOL_HOLO_KEY_PASSWORD \
            -signedjar "$watch_signed_aab" \
            "$watch_unsigned_aab" \
            "$SOL_HOLO_KEY_ALIAS"

          phone_signer_report="$(
            "$build_tools/apksigner" verify --verbose --print-certs "$phone_signed_apk"
          )"
          watch_signer_report="$(
            "$build_tools/apksigner" verify --verbose --print-certs "$watch_signed_apk"
          )"
          printf '%s\n' "$phone_signer_report"
          printf '%s\n' "$watch_signer_report"

          expected_certificate_sha256="e122201077b93cb47edb6951446fb8dff77427a2f5a2bd4719474a638fe803e9"
          phone_certificate_sha256="$(
            printf '%s\n' "$phone_signer_report" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':' \
              | sort -u
          )"
          watch_certificate_sha256="$(
            printf '%s\n' "$watch_signer_report" \
              | sed -n 's/^.*certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':' \
              | sort -u
          )"
          test "$phone_certificate_sha256" = "$expected_certificate_sha256"
          test "$watch_certificate_sha256" = "$expected_certificate_sha256"
          test "$phone_certificate_sha256" = "$watch_certificate_sha256"
          printf '%s\n' "$phone_signer_report" \
            | grep -Fq 'Verified using v1 scheme (JAR signing): true'
          printf '%s\n' "$phone_signer_report" \
            | grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$phone_signer_report" \
            | grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true'
          # Die Watch8 hat minSdk 30. apksigner verwendet dafür standardmäßig
          # ausschließlich das stärkere v3-Schema; v2 ist dort bewusst false.
          printf '%s\n' "$watch_signer_report" \
            | grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true'

          phone_aab_verify_report="$(
            jarsigner -J-Duser.language=en -J-Duser.country=US \
              -verify "$phone_signed_aab"
          )"
          watch_aab_verify_report="$(
            jarsigner -J-Duser.language=en -J-Duser.country=US \
              -verify "$watch_signed_aab"
          )"
          printf '%s\n' "$phone_aab_verify_report"
          printf '%s\n' "$watch_aab_verify_report"
          [[ "$phone_aab_verify_report" == *"jar verified."* ]]
          [[ "$watch_aab_verify_report" == *"jar verified."* ]]

          phone_aab_certificate_sha256="$(
            keytool -J-Duser.language=en -J-Duser.country=US \
              -printcert -jarfile "$phone_signed_aab" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':' \
              | sort -u
          )"
          watch_aab_certificate_sha256="$(
            keytool -J-Duser.language=en -J-Duser.country=US \
              -printcert -jarfile "$watch_signed_aab" \
              | sed -n 's/^[[:space:]]*SHA256: //p' \
              | tr '[:upper:]' '[:lower:]' \
              | tr -d ':' \
              | sort -u
          )"
          test "$phone_aab_certificate_sha256" = "$expected_certificate_sha256"
          test "$watch_aab_certificate_sha256" = "$expected_certificate_sha256"
          test "$phone_aab_certificate_sha256" = "$watch_aab_certificate_sha256"

          phone_package_report="$("$build_tools/aapt" dump badging "$phone_signed_apk")"
          watch_package_report="$("$build_tools/aapt" dump badging "$watch_signed_apk")"
          watch_version_code="$((GITHUB_RUN_NUMBER * 10 + 1))"
          printf '%s\n' "$phone_package_report" \
            | grep -Fq "package: name='com.solholo.app' versionCode='${GITHUB_RUN_NUMBER}'"
          printf '%s\n' "$watch_package_report" \
            | grep -Fq "package: name='com.solholo.app' versionCode='${watch_version_code}'"
          printf '%s\n' "$watch_package_report" \
            | grep -Fq "uses-feature: name='android.hardware.type.watch'"

      - name: APK nur zur dauerhaften externen Signierung bereitstellen
        if: steps.signing_mode.outputs.mode == 'extern_signieren'
        run: |
          set -Eeuo pipefail

          phone_unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          watch_unsigned_apk="android/wear/build/outputs/apk/release/wear-release-unsigned.apk"
          phone_unsigned_aab="android/app/build/outputs/bundle/release/app-release.aab"
          watch_unsigned_aab="android/wear/build/outputs/bundle/release/wear-release.aab"
          phone_signing_source="android/app/build/outputs/apk/release/Sol-Holo-Signierquelle-unsigned.apk"
          watch_signing_source="android/wear/build/outputs/apk/release/Pams-Holo-Watch8-Signierquelle-unsigned.apk"
          phone_play_signing_source="android/app/build/outputs/bundle/release/Pams-Holo-Handy-Play-Signierquelle-unsigned.aab"
          watch_play_signing_source="android/wear/build/outputs/bundle/release/Pams-Holo-Watch8-Play-Signierquelle-unsigned.aab"

          test -s "$phone_unsigned_apk"
          test -s "$watch_unsigned_apk"
          cp -- "$phone_unsigned_apk" "$phone_signing_source"
          cp -- "$watch_unsigned_apk" "$watch_signing_source"
          cp -- "$phone_unsigned_aab" "$phone_play_signing_source"
          cp -- "$watch_unsigned_aab" "$watch_play_signing_source"
          test -s "$phone_signing_source"
          test -s "$watch_signing_source"
          test -s "$phone_play_signing_source"
          test -s "$watch_play_signing_source"

      - name: Pam’s Holo Android APK bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Pams-Holo-Android-${{ steps.signing_mode.outputs.mode }}
          path: |
            android/app/build/outputs/apk/release/Pams-Holo-Update.apk
            android/app/build/outputs/apk/release/Sol-Holo-Signierquelle-unsigned.apk
            android/wear/build/outputs/apk/release/Pams-Holo-Watch8.apk
            android/wear/build/outputs/apk/release/Pams-Holo-Watch8-Signierquelle-unsigned.apk
            android/app/build/outputs/bundle/release/Pams-Holo-Handy-Play.aab
            android/app/build/outputs/bundle/release/Pams-Holo-Handy-Play-Signierquelle-unsigned.aab
            android/wear/build/outputs/bundle/release/Pams-Holo-Watch8-Play.aab
            android/wear/build/outputs/bundle/release/Pams-Holo-Watch8-Play-Signierquelle-unsigned.aab
          if-no-files-found: error
