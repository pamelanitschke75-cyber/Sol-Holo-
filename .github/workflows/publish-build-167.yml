name: Publish Pam's Holo Build 167

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-build-167.yml

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Build 167 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 33981298887 \
            --repo "${{ github.repository }}" \
            --name "Pams-Holo-Android-update" \
            --dir artifact

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          apk_path="$(find artifact -type f -name '*.apk' -print -quit)"
          test -n "$apk_path"
          cp "$apk_path" "Pams-Holo-Update-Build-167-Echter-Alltagsworker.apk"
          sha256sum "Pams-Holo-Update-Build-167-Echter-Alltagsworker.apk"

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-167-echter-alltagsworker"
          asset="Pams-Holo-Update-Build-167-Echter-Alltagsworker.apk"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" "$asset" --clobber --repo "${{ github.repository }}"
          else
            gh release create "$tag" "$asset" \
              --repo "${{ github.repository }}" \
              --target "99ec33aedce16cbe4482b8ed969d4cb5ed5e627d" \
              --title "Pam's Holo – Echter Alltagsworker Build 167" \
              --notes "Originalsigniertes Android-Update aus dem erfolgreichen main-Build #167. Der fiktive Labortest ist in den normalen Diensten verborgen; sichtbar ist nur der aktive echte Alltagsspeicher. Installation als Update; vorhandene App nicht deinstallieren."
          fi
