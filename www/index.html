<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sol Holo – HOLO UI 004</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#05070d">

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
  background: #03050a;
  color: white;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
}

#app {
  position: relative;
  min-height: 100vh;
  max-width: 760px;
  margin: auto;

  background:
    radial-gradient(
      circle at 50% 35%,
      #112238 0%,
      #070b12 38%,
      #020307 75%
    );

  overflow: hidden;
}

#backgroundGlow {
  position: absolute;
  inset: 0;
  pointer-events: none;

  background:
    radial-gradient(
      circle at 18% 44%,
      rgba(255,180,70,.10),
      transparent 28%
    ),
    radial-gradient(
      circle at 85% 42%,
      rgba(20,100,255,.12),
      transparent 30%
    );
}

header {
  position: relative;
  z-index: 20;
  padding: 24px 24px 10px;
  text-align: center;
}

#menuButton {
  position: absolute;
  left: 18px;
  top: 22px;
  width: 52px;
  height: 52px;
  border: none;
  background: transparent;
  color: white;
  font-size: 32px;
  cursor: pointer;
}

#onlineState {
  position: absolute;
  right: 20px;
  top: 34px;
  font-size: 15px;
  color: #d6dbe5;
}

#onlineDot {
  color: #41e66e;
}

h1 {
  margin: 0;
  font-size: 40px;
  font-weight: 600;
  text-shadow:
    0 0 22px rgba(255,196,90,.25);
}

#subtitle {
  margin-top: 7px;
  color: #f3c969;
  font-size: 17px;
}

#greeting {
  position: relative;
  z-index: 10;
  padding: 22px 28px 0;
}

#greetingTitle {
  font-size: 29px;
  margin: 0 0 8px;
}

#greetingText {
  color: #d7dbe2;
  line-height: 1.5;
  font-size: 18px;
  margin: 0;
}

#solStage {
  position: relative;
  z-index: 4;
  height: min(52vh, 590px);
  min-height: 390px;
  margin-top: -25px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  overflow: hidden;
}

#solCloneWrap {
  position: relative;
  display: inline-block;
  height: 95%;
  max-width: 100%;
  transform-origin: center bottom;
}

#solImage {
  display: block;
  height: 100%;
  width: auto;
  max-width: 100%;
  object-fit: contain;
  object-position: center bottom;

  filter:
    drop-shadow(0 0 8px rgba(70,145,255,.42))
    drop-shadow(0 0 24px rgba(25,105,255,.22));

  user-select: none;
  pointer-events: none;
}

#mouthPatch {
  position: absolute;
  display: none;
  z-index: 8;
  pointer-events: none;
  background-repeat: no-repeat;
  transform-origin: 50% 42%;
  will-change: transform, filter, opacity;
  border-radius: 48% 48% 46% 46%;

  -webkit-mask-image:
    radial-gradient(
      ellipse at center,
      #000 42%,
      rgba(0,0,0,.92) 58%,
      transparent 78%
    );

  mask-image:
    radial-gradient(
      ellipse at center,
      #000 42%,
      rgba(0,0,0,.92) 58%,
      transparent 78%
    );
}

#mouthDepth {
  position: absolute;
  display: none;
  z-index: 7;
  pointer-events: none;
  border-radius: 50%;

  background:
    radial-gradient(
      ellipse at center,
      rgba(5,2,3,.86) 0%,
      rgba(15,4,7,.58) 40%,
      transparent 75%
    );

  transform-origin: center;
  opacity: 0;
  will-change: transform, opacity;
}

#solCloneWrap.sol-speaking {
  animation: solSpeakingPresence 1.9s ease-in-out infinite;
}

@keyframes solSpeakingPresence {
  0% {
    transform: translateY(0) scale(1);
  }

  50% {
    transform: translateY(-1px) scale(1.0015);
  }

  100% {
    transform: translateY(0) scale(1);
  }
}

#holoBase {
  position: absolute;
  bottom: 14px;
  width: 78%;
  height: 24px;
  border-radius: 50%;
  border: 2px solid rgba(80,160,255,.8);

  box-shadow:
    0 0 8px #54a6ff,
    0 0 26px rgba(40,120,255,.75),
    0 0 55px rgba(40,120,255,.35);
}

#chatPanel {
  position: relative;
  z-index: 25;
  margin: -4px 20px 14px;
  padding: 14px;
  border: 1px solid rgba(78,91,110,.75);
  border-radius: 20px;
  background: rgba(7,11,18,.82);
  backdrop-filter: blur(10px);
}

#chat {
  max-height: 240px;
  overflow-y: auto;
  padding: 2px;
}

.message {
  margin: 9px 0;
  padding: 11px 13px;
  border-radius: 15px;
  line-height: 1.45;
  white-space: pre-wrap;
  font-size: 17px;
}

.message strong {
  display: block;
  margin-bottom: 4px;
}

.user-message {
  margin-left: 28px;
  background: #14264f;
}

.sol-message {
  margin-right: 28px;
  background: #15271b;
}

.system-message {
  color: #c9d0db;
  background: rgba(36,43,54,.70);
}

#controls {
  position: relative;
  z-index: 30;
  padding: 0 20px 26px;
}

#inputRow {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 72px;
  gap: 10px;
  align-items: center;
}

#messageWrap {
  display: flex;
  align-items: center;
  min-height: 66px;
